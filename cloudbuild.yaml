# Cloud Build (main-push trigger): build the app image, push it, run pending
# case-store migrations once via the migrate Job, then deploy a new Cloud Run
# revision. Cloud Run waits for the startup probe before moving traffic; that
# ordinary deployment path is the whole release mechanism — Nova keeps no
# custom cutover control plane, traffic split, or staged activation.
#
# Migrations run as a dedicated Cloud Run Job here — NOT on every container
# boot — so a cold start is just Node coming up (no Cloud SQL connect +
# migration-lock wait on the startup critical path). The Job reuses the app
# image with a command override. If the migration fails the build stops before
# `deploy`, so the old revision keeps serving and we never ship code ahead of a
# failed schema change (same guarantee the old startup CMD gave, at deploy time).
steps:
  # Validate the one checked-in runtime-capability manifest and render the
  # shell-safe image declarations consumed below. The workspace persists across
  # Cloud Build steps, so no version or timeout literal is duplicated in YAML.
  # The unique Cloud Build UUID is baked beside the declarations so `/warmup`
  # can reject a malformed or runtime-overridden image identity.
  - id: runtime-capabilities
    name: node:24.18.1-alpine
    entrypoint: node
    args:
      - scripts/rollout/render-build-config.mjs
      - --check
      - --build-id
      - $BUILD_ID
      - --output
      - /workspace/rollout.env

  # These values ride into the image build as build args because `next build`
  # consumes them at BUILD time, not runtime:
  #   • SENTRY_AUTH_TOKEN (Secret Manager: `nova-sentry`) — lets the build
  #     upload source maps; without it every Sentry stack trace stays minified.
  #   • NEXT_PUBLIC_GOOGLE_MAPS_API_KEY (Secret Manager: `nova-google_maps_api_key`,
  #     the PROD browser key, referrer-restricted to commcare.app) +
  #     NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID (a public, non-secret identifier, inlined
  #     literally) — `NEXT_PUBLIC_` vars are baked into the client bundle by
  #     `next build`, so a Cloud Run runtime env var would NOT reach them; they
  #     must be present at build. Without them the geopoint picker degrades to
  #     manual lat/lon entry.
  #   • NEXT_SERVER_ACTIONS_ENCRYPTION_KEY (Secret Manager: `nova-server-actions-key`,
  #     a base64 AES key) — pins the key Next derives Server Action IDs from, so an
  #     already-open builder tab keeps calling the new deploy's actions instead of
  #     getting "Failed to find Server Action". Create the secret AND grant the
  #     trigger SA accessor (see the note below) BEFORE this change lands: Cloud
  #     Build fetches every `availableSecrets` entry up front and fails the whole
  #     build if one is missing or unreadable. (`next build` itself tolerates an
  #     empty value — it falls back to a per-build random key that re-rolls action
  #     IDs every build — but the build never reaches that point without the
  #     secret existing.)
  #   • NEXT_DEPLOYMENT_ID (= $BUILD_ID, a non-secret literal) — feeds
  #     next.config.ts's `deploymentId`, so a client on an old build hard-reloads
  #     onto the new one when it hits a changed/removed action or a stale chunk.
  #     Use $BUILD_ID, NOT $COMMIT_SHA: $COMMIT_SHA is empty for non-commit builds
  #     (a manual `gcloud builds submit` / console re-run), which would ship a
  #     revision with `deploymentId:""` (falsy → skew protection silently off);
  #     and a retried/rebuilt commit reuses the same SHA but gets fresh per-build
  #     chunk hashes, so a SHA-keyed id would miss that skew. $BUILD_ID is always
  #     set and unique per build, so it changes between any two deploys.
  #   • NOVA_BUILD_ID is that same rendered Cloud Build UUID. It remains the
  #     runtime startup-health identity and is also baked into browser/server
  #     Sentry releases, so an error names the exact code that observed it and
  #     uploaded source maps use the same release.
  # Secrets only reach a step through env vars, and env vars only expand under a
  # shell, hence the bash wrapper. The trigger's service account needs
  # `roles/secretmanager.secretAccessor` on each secret or the build fails
  # before this step runs.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - SENTRY_AUTH_TOKEN
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/rollout.env
        docker build \
          -t "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app:$BUILD_ID" \
          --build-arg SENTRY_AUTH_TOKEN="$$SENTRY_AUTH_TOKEN" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID="ac18fb2d87e44a1eb5a19883" \
          --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" \
          --build-arg NEXT_DEPLOYMENT_ID="$BUILD_ID" \
          --build-arg NOVA_BUILD_ID="$$NOVA_BUILD_ID" \
          --build-arg NOVA_CLOUD_RUN_REQUEST_SECONDS="$$NOVA_CLOUD_RUN_REQUEST_SECONDS" \
          --build-arg NOVA_EDIT_RUN_LEASE_SECONDS="$$NOVA_EDIT_RUN_LEASE_SECONDS" \
          --build-arg NOVA_BUILD_STALENESS_SECONDS="$$NOVA_BUILD_STALENESS_SECONDS" \
          --build-arg NOVA_RUNTIME_CAPABILITY_MANIFEST_HASH="$$NOVA_RUNTIME_CAPABILITY_MANIFEST_HASH" \
          -f Dockerfile .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app:$BUILD_ID"

  # Resolve the just-pushed tag once, before any Job can mutate storage or the
  # database. Every later operation sources this file and receives the complete
  # repository@sha256 reference; mutable build tags are build/push inputs only.
  - id: resolve-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - scripts/rollout/deploy-cloud-run.py
      - --resolve-image
      - --project=$PROJECT_ID
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app:$BUILD_ID
      - --output=/workspace/image.env

  # Resolve the service scaling posture before configuring deployment Jobs.
  # Manual zero can be a partially recovered admission cutover, so do not
  # require its other maintenance axes here: xpath-admission-cutover owns their
  # full convergence once the exact-image session-fence Job is configured.
  - id: deployment-prestate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        service_prestate="$$(python3 scripts/rollout/deploy-cloud-run.py \
          --read-scaling-prestate \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --service=commcare-nova)"
        case "$${service_prestate}" in
          automatic|manual-zero) ;;
          *)
            echo "Unknown service scaling prestate $${service_prestate}." >&2
            exit 1
            ;;
        esac

  # The complete media-bucket retention policy and signed-upload CORS are
  # release prerequisites, not a manual runbook. This create-or-update Job
  # runs the policy bundle from the exact image about to deploy; a failure
  # stops the build before migrations or traffic movement.
  - id: media-policy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        gcloud run jobs deploy commcare-nova-media-policy \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-media-policy@commcare-nova.iam.gserviceaccount.com \
          --set-env-vars=NOVA_MEDIA_BUCKET=nova-multimedia-prod,NOVA_UPLOAD_CORS_ORIGINS=https://commcare.app \
          --command=node \
          --args=media-bucket-policy.cjs \
          --tasks=1 --parallelism=1 \
          --max-retries=1 \
          --task-timeout=300
        python3 scripts/rollout/deploy-cloud-run.py \
          --execute-job \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --job=commcare-nova-media-policy \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --wait-seconds=360

  # Apply pending case-store migrations against live Cloud SQL, once. `jobs
  # deploy` is create-or-update (idempotent) so the Job's config lives here in
  # version control and stays pinned to the image being deployed. The Job runs
  # the bundled `migrate.cjs` entrypoint (`node migrate.cjs`), which reuses
  # `getCaseStoreDatabase()` — so it connects through the SAME
  # `@google-cloud/cloud-sql-connector` + IAM path the runtime uses, not Atlas's
  # raw `postgres://` URL. It therefore needs `NOVA_DB_INSTANCE_CONNECTION_NAME`
  # (the connector's input), NOT `NOVA_DB_HOST`. The Job mirrors the service's
  # identity + network: the IAM service account and Direct VPC Egress (private-IP
  # Cloud SQL). The etag-bound v2 execution helper fails the build on any
  # generation/image mismatch or non-zero task result.
  - id: configure-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        gcloud run jobs deploy commcare-nova-migrate \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-migrate@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --set-env-vars=NOVA_DB_WORKLOAD=migration,NOVA_DB_USER=nova-migrate@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_MIGRATION_DB_USER=nova-migrate@commcare-nova.iam,NOVA_RUNTIME_DB_USER=commcare-nova@commcare-nova.iam,NOVA_CAPTURE_CLEANUP_DB_USER=nova-capture-cleanup@commcare-nova.iam,NOVA_AUDIT_DB_USER=nova-audit@commcare-nova.iam,NODE_OPTIONS=--max-old-space-size=7168 \
          --command=node \
          --args=migrate.cjs \
          --tasks=1 --parallelism=1 \
          --memory=8Gi --cpu=4 \
          --max-retries=0 \
          --task-timeout=3000
  # The v1 XPath carrier gate is an admission cutover, not only a database
  # scan. On its first deployment, drain the old revision and every independent
  # case writer BEFORE the migration verifies the fleet, then keep ingress
  # detached until the exact candidate is Ready. The label makes this a
  # one-time cutover and is written only after deployment
  # reaches terminal success; a failed deployment remains in recoverable
  # manual-zero maintenance and a retry reuses and re-verifies that posture.
  - id: xpath-admission-cutover
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        deployed_gate="$$(gcloud run services describe commcare-nova \
          --region=us-central1 \
          --project="$PROJECT_ID" \
          --format=json \
          | python3 -c 'import json, sys; print(json.load(sys.stdin).get("metadata", {}).get("labels", {}).get("nova-xpath-carrier-gate", ""))')"
        if [[ "$${deployed_gate}" != v1 ]]; then
          python3 scripts/rollout/deploy-cloud-run.py \
            --enter-maintenance \
            --project="$PROJECT_ID" \
            --region=us-central1 \
            --service=commcare-nova \
            --image="$${NOVA_IMMUTABLE_IMAGE}" \
            --expected-min=1 \
            --expected-max=4 \
            --maintenance-backend-service=nova-backend \
            --maintenance-neg=nova-neg \
            --maintenance-cleanup-scheduler=commcare-nova-capture-cleanup \
            --maintenance-session-fence-job=commcare-nova-migrate
        fi

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        python3 scripts/rollout/deploy-cloud-run.py \
          --execute-job \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --job=commcare-nova-migrate \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --wait-seconds=3060

  # Pre-acceptance preparation and exact discard recovery are traffic-
  # independent. Cloud Scheduler invokes this bounded worker every five
  # minutes; its Postgres advisory lock collapses at-least-once delivery to one
  # active execution.
  - id: capture-cleanup
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        cleanup_job=commcare-nova-capture-cleanup
        scheduler_account=nova-capture-scheduler@commcare-nova.iam.gserviceaccount.com
        service_prestate="$$(python3 scripts/rollout/deploy-cloud-run.py \
          --read-scaling-prestate \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --service=commcare-nova)"
        case "$${service_prestate}" in
          automatic|manual-zero) ;;
          *)
            echo "Unknown service scaling prestate $${service_prestate}." >&2
            exit 1
            ;;
        esac
        scheduler_existed=false
        scheduler_error_file=/workspace/capture-cleanup-scheduler-describe.err
        if scheduler_state_before="$$(gcloud scheduler jobs describe "$${cleanup_job}" \
          --location=us-central1 --format='value(state)' \
          2>"$${scheduler_error_file}")"; then
          scheduler_existed=true
        elif grep -Eqi 'not[ _-]?found|does not exist' "$${scheduler_error_file}"; then
          scheduler_state_before=
        else
          cat "$${scheduler_error_file}" >&2
          exit 1
        fi
        if [[ "$${service_prestate}" == manual-zero ]]; then
          if [[ "$${scheduler_existed}" != true ]]; then
            echo "Maintenance requires a pre-existing PAUSED cleanup scheduler." >&2
            exit 1
          fi
          if [[ "$${scheduler_state_before}" != PAUSED ]]; then
            echo "Maintenance cleanup scheduler is not PAUSED." >&2
            exit 1
          fi
        fi
        scheduler_step_succeeded=false
        restore_scheduler_state() {
          if [[ "$${scheduler_step_succeeded}" == true || "$${scheduler_existed}" != true ]]; then
            return
          fi
          set +e
          case "$${scheduler_state_before}" in
            PAUSED)
              gcloud scheduler jobs pause "$${cleanup_job}" \
                --location=us-central1 --quiet
              ;;
            ENABLED)
              gcloud scheduler jobs resume "$${cleanup_job}" \
                --location=us-central1 --quiet
              ;;
            *)
              echo "Cannot restore unknown scheduler state $${scheduler_state_before}." >&2
              return
              ;;
          esac
          restored_state="$$(gcloud scheduler jobs describe "$${cleanup_job}" \
            --location=us-central1 --format='value(state)')"
          if [[ "$${restored_state}" != "$${scheduler_state_before}" ]]; then
            echo "Failed to restore capture-cleanup scheduler state to $${scheduler_state_before}." >&2
          fi
        }
        trap restore_scheduler_state EXIT
        gcloud run jobs deploy "$${cleanup_job}" \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-capture-cleanup@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --set-env-vars=NOVA_DB_WORKLOAD=capture-cleanup,NOVA_DB_USER=nova-capture-cleanup@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_MEDIA_BUCKET=nova-multimedia-prod \
          --command=node \
          --args=capture-cleanup.cjs \
          --tasks=1 --parallelism=1 \
          --max-retries=0 \
          --task-timeout=1260
        gcloud run jobs add-iam-policy-binding "$${cleanup_job}" \
          --region=us-central1 \
          --member="serviceAccount:$${scheduler_account}" \
          --role=roles/run.invoker
        scheduler_uri="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/us-central1/jobs/$${cleanup_job}:run"
        scheduler_args=(
          --location=us-central1
          --schedule="*/5 * * * *"
          --time-zone=Etc/UTC
          --uri="$${scheduler_uri}"
          --http-method=POST
          --message-body='{}'
          --oauth-service-account-email="$${scheduler_account}"
          --oauth-token-scope=https://www.googleapis.com/auth/cloud-platform
        )
        if [[ "$${scheduler_existed}" == true ]]; then
          gcloud scheduler jobs update http "$${cleanup_job}" "$${scheduler_args[@]}" \
            --update-headers=Content-Type=application/json
        else
          gcloud scheduler jobs create http "$${cleanup_job}" "$${scheduler_args[@]}" \
            --headers=Content-Type=application/json
        fi
        scheduler_state_after="$$(gcloud scheduler jobs describe "$${cleanup_job}" \
          --location=us-central1 --format='value(state)')"
        if [[ "$${scheduler_existed}" == true ]]; then
          if [[ "$${scheduler_state_after}" != "$${scheduler_state_before}" ]]; then
            echo "Capture-cleanup scheduler state changed from $${scheduler_state_before} to $${scheduler_state_after}." >&2
            exit 1
          fi
        elif [[ "$${scheduler_state_after}" != ENABLED ]]; then
          echo "New capture-cleanup scheduler is not enabled." >&2
          exit 1
        fi
        python3 scripts/rollout/deploy-cloud-run.py \
          --execute-job \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --job="$${cleanup_job}" \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --wait-seconds=1320 \
          --execution-arg=capture-cleanup.cjs \
          --execution-arg=--probe-schema
        scheduler_state_after_probe="$$(gcloud scheduler jobs describe "$${cleanup_job}" \
          --location=us-central1 --format='value(state)')"
        if [[ "$${scheduler_state_after_probe}" != "$${scheduler_state_before}" && "$${scheduler_existed}" == true ]]; then
          echo "Capture-cleanup schema probe changed scheduler state from $${scheduler_state_before} to $${scheduler_state_after_probe}." >&2
          exit 1
        fi
        scheduler_step_succeeded=true
        trap - EXIT

  # The checked-in deployment policy accepts only automatic scaling or the
  # maintenance cutover's manual-zero state. `gcloud run deploy` deliberately
  # receives no `--scaling` flag, then the policy proves the exact immutable
  # candidate is Ready at 100% with no tags before a separate scaling-only
  # `--scaling=auto` update. That last update must create no revision.
  #
  # Both service-level and revision-level min/max bounds are pinned. Manual
  # scaling ignores them while the maintenance candidate passes its deployment
  # health check; returning to automatic scaling restores the exact 1..4
  # service range without a second revision.
  #
  # `--no-cpu-throttling` (CPU always allocated) is REQUIRED, not tuning: the
  # Cloud SQL connector refreshes its short-lived ephemeral mTLS certificate on
  # a BACKGROUND timer, and Cloud Run's default request-scoped CPU throttling
  # starves that timer between requests. On a low-traffic service the idle gaps
  # are long enough that the refresh's TLS handshake to `sqladmin.googleapis.com`
  # dies mid-flight (ECONNRESET) and the cert lapses — after which every new DB
  # connection is rejected with SSL alert 42 (bad certificate) until the instance
  # restarts. Auth and case data both ride this connector, so a lapse takes down
  # sign-in, not just case reads. Allocating CPU always keeps the refresh cycle
  # alive. See cloud-sql-nodejs-connector issues #285 / #379.
  #
  # `--startup-probe` points at `/warmup` (see `app/(app)/warmup/page.tsx`):
  # a new instance only takes traffic once it has rendered a page, which
  # forces the multi-second lazy load of the server module graph to happen
  # BEFORE readiness instead of inside a user's first request. Node listens
  # within ~1s of boot, so a TCP probe would mark the instance ready while
  # that cost is still unpaid — every deploy and autoscale-up would route
  # users onto a module-cold instance.
  #
  # Probe math is platform-constrained: timeoutSeconds must not exceed
  # periodSeconds, and failureThreshold × periodSeconds caps at 240s. The
  # 10s timeout lets a single attempt wait out the first render (~6s warm
  # cost); 24 × 10s gives the full four-minute window before the instance
  # is declared failed — in practice the second attempt succeeds. The probe
  # port is Cloud Run's default container port; if a `--port` override ever
  # lands here, httpGet.port must move with it.
  #
  # `--update-secrets` MERGES into the service's existing secret env vars
  # (unlike `--set-secrets`, which replaces the whole set). OPENAI_API_KEY is
  # the one LLM credential (Secret Manager: `nova-openai-api-key`, resolved
  # `latest` at instance start by the RUNTIME service account — which needs
  # `roles/secretmanager.secretAccessor` on it). A secret with no version
  # fails the revision loudly at deploy, so paste the key BEFORE merging.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/rollout.env
        source /workspace/image.env
        python3 scripts/rollout/deploy-cloud-run.py \
          --project="$PROJECT_ID" \
          --region=us-central1 \
          --service=commcare-nova \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --expected-min=1 \
          --expected-max=4 \
          --maintenance-backend-service=nova-backend \
          --maintenance-neg=nova-neg \
          --maintenance-cleanup-scheduler=commcare-nova-capture-cleanup \
          --maintenance-session-fence-job=commcare-nova-migrate \
          -- \
          --service-account=commcare-nova@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --update-env-vars=NOVA_DB_WORKLOAD=service,NOVA_DB_USER=commcare-nova@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_MEDIA_BUCKET=nova-multimedia-prod \
          --no-default-url --ingress=internal-and-cloud-load-balancing \
          --min=1 --max=4 --min-instances=1 --max-instances=4 \
          --timeout="$${NOVA_CLOUD_RUN_REQUEST_SECONDS}s" \
          --no-cpu-throttling \
          --update-secrets=OPENAI_API_KEY=nova-openai-api-key:latest \
          --startup-probe=httpGet.path=/warmup,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=10,periodSeconds=10,failureThreshold=24

  # Record the one-time admission cutover only after deploy-cloud-run has
  # reached its terminal state: exact candidate Ready and owning all traffic,
  # automatic scaling restored, ingress attached, and cleanup resumed. If this
  # metadata write fails, the next build safely repeats the maintenance entry
  # and migration instead of trusting a partially deployed candidate.
  - id: xpath-admission-cutover-complete
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - commcare-nova
      - --region=us-central1
      - --project=$PROJECT_ID
      - --update-labels=nova-xpath-carrier-gate=v1
      - --quiet

  # Configure, but DO NOT execute, the one-off repair for valid apps created by
  # the former pre-plan build flow. The Job is pinned to the image that now owns
  # traffic and stores dry-run args. An operator runs the read-only production
  # scan, explicitly executes this Job with --execute, then scans again. Each
  # write locks the app and refuses a live holder, so this convergence does not
  # need a traffic drain.
  - id: legacy-preplan-repair-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        gcloud run jobs deploy commcare-nova-legacy-preplan-repair \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-migrate@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --set-env-vars=NOVA_DB_WORKLOAD=migration,NOVA_DB_USER=nova-migrate@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_LEGACY_PREPLAN_PRODUCTION_JOB=true \
          --command=node \
          --args=legacy-preplan-repair.cjs \
          --tasks=1 --parallelism=1 \
          --memory=2Gi --cpu=1 \
          --max-retries=0 \
          --task-timeout=900

  # Configure, but DO NOT execute, the one-off case-type retirement backfill
  # from the exact immutable image that now owns 100% traffic. The previous
  # application binary can remove a type without writing retired_seq, so an
  # operator runs this write-capable Job only after every old-revision request
  # has drained, then runs the read-only production scanner as the independent
  # zero-finding proof. Keeping the Job definition in the deployment path makes
  # that post-cutover operation reproducible; it is deliberately not a
  # deploy-time gate or an automatic recurring worker.
  - id: case-type-schema-retirement-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        gcloud run jobs deploy commcare-nova-case-type-schema-retirement \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-migrate@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --set-env-vars=NOVA_DB_WORKLOAD=migration,NOVA_DB_USER=nova-migrate@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_CASE_TYPE_RETIREMENT_PRODUCTION_JOB=true \
          --command=node \
          --args=case-type-schema-retirement.cjs \
          --tasks=1 --parallelism=1 \
          --memory=8Gi --cpu=4 \
          --max-retries=0 \
          --task-timeout=3000

  # Deploy the one-time ordinary extension-edge repair as a dormant immutable
  # Job. Deployment stores dry-run args only; an operator explicitly executes
  # the checked-in --execute override after traffic cutover and old-request
  # drain, then proves convergence with the independent read-only scanner.
  - id: case-parent-relationship-repair-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image.env
        gcloud run jobs deploy commcare-nova-case-parent-relationship-repair \
          --image="$${NOVA_IMMUTABLE_IMAGE}" \
          --region=us-central1 \
          --service-account=nova-migrate@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --set-env-vars=NOVA_DB_WORKLOAD=migration,NOVA_DB_USER=nova-migrate@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_CASE_PARENT_RELATIONSHIP_PRODUCTION_JOB=true \
          --command=node \
          --args=case-parent-relationship-repair.cjs \
          --tasks=1 --parallelism=1 \
          --memory=8Gi --cpu=4 \
          --max-retries=0 \
          --task-timeout=3000

  # Exercise the three public host contracts after Cloud Run has completed its
  # standard traffic move. The MCP surface is healthy only when an
  # unauthenticated initialize request receives the OAuth discovery challenge,
  # not a generic 401 from the wrong host or proxy layer.
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for url in https://commcare.app/ https://docs.commcare.app/; do
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$${url}" >/dev/null
        done
        http_code=000
        for attempt in $$(seq 1 12); do
          http_code="$$(curl --silent --show-error \
            --dump-header /workspace/mcp-headers \
            --output /workspace/mcp-body \
            --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":"cloud-build","method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"nova-cloud-build","version":"1"}}}' \
            https://mcp.commcare.app/mcp || true)"
          if test "$${http_code}" = 401; then break; fi
          sleep 5
        done
        test "$${http_code}" = 401
        awk 'BEGIN { found=0 } {
          line=tolower($$0)
          if (line ~ /^www-authenticate:/ && line ~ /bearer / && line ~ /resource_metadata=/) found=1
        } END { exit(found ? 0 : 1) }' /workspace/mcp-headers

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/nova-sentry/versions/latest
      env: SENTRY_AUTH_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/nova-google_maps_api_key/versions/latest
      env: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    # Pinned to an explicit version, NOT `latest`: this key's whole job is to stay
    # constant across builds. Following `latest` would let a routine secret rotation
    # silently change the key with no code change, re-rolling every Server Action ID
    # and 500-ing every already-open tab on the next deploy. Rotating is therefore a
    # deliberate, breaking-for-open-tabs act: add a new secret version, bump this
    # pin to match, and expect open sessions to reload once. Value must be a base64
    # AES key (16/24/32 bytes) — `openssl rand -base64 32`.
    - versionName: projects/$PROJECT_ID/secrets/nova-server-actions-key/versions/1
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
