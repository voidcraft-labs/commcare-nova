# One application release. Stable infrastructure and the recurring cleanup
# worker are maintained explicitly, outside this pipeline.
steps:
  - id: runtime-capabilities
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    entrypoint: node
    args: [scripts/rollout/render-build-config.mjs, --check, --build-id, '$BUILD_ID', --output, /workspace/rollout.env]

  - id: prepare-builder
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker version
        docker buildx create --name "nova-$BUILD_ID" --driver docker-container \
          --driver-opt image=moby/buildkit:v0.33.0
        docker buildx inspect --builder "nova-$BUILD_ID" --bootstrap >/dev/null

  - id: prerequisites
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: ['-']
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        python3 scripts/infra/manage-deployment.py check
        python3 scripts/rollout/deploy-cloud-run.py --read-scaling-prestate \
          --project="$PROJECT_ID" --region=us-central1 --service=commcare-nova

  - id: restore-cache
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: ['-']
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        case '${_CACHE_MODE}' in
          cold) python3 scripts/rollout/build-cache.py restore --build-id="$BUILD_ID" --cold ;;
          warm) python3 scripts/rollout/build-cache.py restore --build-id="$BUILD_ID" ;;
          *) exit 2 ;;
        esac

  - id: migration-image
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [prepare-builder, restore-cache]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/cache.env
        export NOVA_BUILD_ID="$BUILD_ID"
        export NOVA_BUILDX_BUILDER="nova-$BUILD_ID"
        export NOVA_MIGRATION_IMAGE_TAG="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/migrate:$BUILD_ID"
        bash scripts/rollout/build-migration-image.sh

  - id: build
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [runtime-capabilities, prepare-builder, restore-cache]
    entrypoint: bash
    secretEnv: [SENTRY_AUTH_TOKEN, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/rollout.env
        source /workspace/cache.env
        export NOVA_BUILDX_BUILDER="nova-$BUILD_ID"
        export NOVA_SEPARATE_MIGRATION_BUILD=true
        export NOVA_IMAGE_OUTPUT=registry
        export NOVA_IMAGE_TAG="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app:$BUILD_ID"
        export NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=ac18fb2d87e44a1eb5a19883
        export NEXT_DEPLOYMENT_ID="$BUILD_ID"
        bash scripts/rollout/build-image.sh

  # An unchanged immutable migration artifact reuses its verified successful
  # Execution. Changed migration code runs while the application compiles.
  - id: migrate
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [migration-image, prerequisites]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        python3 scripts/rollout/image-metadata.py \
          --metadata=/workspace/.nova-build-cache/migration-image.json \
          --repository="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/migrate" \
          --output=/workspace/migration.env
        . /workspace/migration.env
        python3 scripts/rollout/migration-gate.py \
          --project="$PROJECT_ID" --region=us-central1 \
          --job=commcare-nova-migrate --image="$${NOVA_IMMUTABLE_IMAGE}"

  - id: resolve-image
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [build]
    entrypoint: python3
    args:
      - scripts/rollout/image-metadata.py
      - --metadata=/workspace/.nova-build-cache/app-image.json
      - --repository=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app
      - --output=/workspace/image.env

  # Cache images contain compiler state only. Their publication overlaps the
  # service update instead of holding the application image on the build host.
  - id: export-cache
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [build, migration-image]
    entrypoint: bash
    secretEnv: [SENTRY_AUTH_TOKEN, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/rollout.env
        source /workspace/cache.env
        export NOVA_BUILDX_BUILDER="nova-$BUILD_ID"
        export NOVA_IMAGE_TAG="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/commcare-nova/app:$BUILD_ID"
        export NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=ac18fb2d87e44a1eb5a19883
        export NEXT_DEPLOYMENT_ID="$BUILD_ID"
        bash scripts/rollout/export-build-cache.sh

  - id: publish-cache
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [export-cache]
    entrypoint: python3
    args: [scripts/rollout/build-cache.py, publish, '--build-id=$BUILD_ID']

  - id: deploy
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [migrate, resolve-image]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/rollout.env
        source /workspace/image.env
        python3 scripts/rollout/deploy-cloud-run.py \
          --project="$PROJECT_ID" --region=us-central1 --service=commcare-nova \
          --image="$${NOVA_IMMUTABLE_IMAGE}" --expected-min=1 --expected-max=4 \
          -- \
          --service-account=commcare-nova@commcare-nova.iam.gserviceaccount.com \
          --network=default --subnet=default --vpc-egress=private-ranges-only \
          --update-env-vars=NOVA_DB_WORKLOAD=service,NOVA_DB_USER=commcare-nova@commcare-nova.iam,NOVA_DB_INSTANCE_CONNECTION_NAME=commcare-nova:us-central1:nova-cases,NOVA_DB_NAME=nova_cases,NOVA_MEDIA_BUCKET=nova-multimedia-prod \
          --no-default-url --ingress=internal-and-cloud-load-balancing \
          --min=1 --max=4 --min-instances=1 --max-instances=4 \
          --timeout="$${NOVA_CLOUD_RUN_REQUEST_SECONDS}s" \
          --no-cpu-throttling \
          --update-secrets=OPENAI_API_KEY=nova-openai-api-key:latest \
          --startup-probe=httpGet.path=/warmup,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=10,periodSeconds=10,failureThreshold=24

  - id: verify
    name: us-central1-docker.pkg.dev/commcare-nova/cloud-run-source-deploy/commcare-nova/build-tools@sha256:17ca7d7adefc8c5db411830c636ca7b266311cea13770adefd693779996814f0
    waitFor: [deploy]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        for url in https://commcare.app/ https://docs.commcare.app/; do
          curl --fail --silent --show-error --max-time 30 \
            --retry 12 --retry-delay 5 --retry-all-errors "$${url}" >/dev/null
        done
        http_code=000
        for attempt in $$(seq 1 12); do
          http_code="$$(curl --silent --show-error --max-time 30 \
            --dump-header /workspace/mcp-headers --output /workspace/mcp-body \
            --write-out '%{http_code}' --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":"cloud-build","method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"nova-cloud-build","version":"1"}}}' \
            https://mcp.commcare.app/mcp || true)"
          if test "$${http_code}" = 401; then break; fi
          sleep 5
        done
        test "$${http_code}" = 401
        awk 'BEGIN { found=0 } {
          line=tolower($$0)
          if (line ~ /^www-authenticate:/ && line ~ /bearer / && line ~ /resource_metadata=/) found=1
        } END { exit(found ? 0 : 1) }' /workspace/mcp-headers

substitutions:
  _CACHE_MODE: warm
options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/nova-sentry/versions/latest
      env: SENTRY_AUTH_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/nova-google_maps_api_key/versions/latest
      env: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    # Never rotate the pinned Action key during an ordinary deployment.
    - versionName: projects/$PROJECT_ID/secrets/nova-server-actions-key/versions/1
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
