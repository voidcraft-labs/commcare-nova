name: C5 focused verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        scope: [browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$version" --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - if: matrix.scope == 'typescript'
        run: npm run typecheck
      - uses: ./.github/actions/pull-test-image
        if: matrix.scope != 'typescript'
      - if: matrix.scope == 'app-test'
        run: node_modules/.bin/vitest run --maxWorkers=1 lib/preview/app-tests/__tests__/journey.postgres.test.ts -t 'automatically opens and atomically closes'
      - if: matrix.scope == 'overflow'
        run: node_modules/.bin/vitest run --maxWorkers=1 lib/case-store/postgres/__tests__/submissionEnvelope.postgres.test.ts -t 'refuses a 101-case selection'
      - if: matrix.scope == 'browser'
        run: npx playwright install --with-deps --only-shell chromium
      - if: matrix.scope == 'browser'
        run: npm run test:smoke -- --project=authed e2e/tests/app/automatic-case-selection.spec.ts --retries=0
      - if: matrix.scope == 'browser' && always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-browser-receipt
          path: |
            e2e/playwright-report
            e2e/test-results
