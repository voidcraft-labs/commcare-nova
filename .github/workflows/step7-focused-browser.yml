name: Step 7 focused Builder rehearsal
on:
  push:
    branches: [proof/step7-lookup-names]
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Exercise a table and worker places from the Builder
        env:
          SMOKE_LANE: app
        run: npm run test:smoke -- --project=authed e2e/tests/app/authed.spec.ts --grep 'a select can be pointed' --workers=1 --fail-on-flaky-tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-observations
          path: test-results
          if-no-files-found: ignore
