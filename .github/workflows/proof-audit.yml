name: Proof audit

# The proof lane's nightly and weekly runs on main (proof/README.md, "The
# lane in CI"). A pull request's lane runs without the readers and reads
# records and judgments from the evidence store under keys meant to cover
# every input; these run the readers and hold the store to its keys.
#
# The repository runs on GitHub's free plan for organizations: twenty jobs at
# once, six hours a job. The lane with every reader costs about 300
# worker-hours observed whole (a document's group 800 to 2,400 seconds on one
# worker, most of it the Android devices' JVMs and the Web Apps client's
# walks), so a whole fresh lane would hold every runner for about five hours.
# So it runs whole once a week, and each night only what changed.
#
# Nightly, on main: the lane in both of its profiles (proof/lane/readers.py),
# with every reader and without them, each queued as a pull request's is,
# against main's newest store snapshot: a cached group runs nowhere and the
# gate holds its stored evidence, the audit sample is observed afresh, and
# every group whose key changed since the last snapshot is observed. Both are
# merged over main's snapshot into its newest (proof-store-save.yml, `base`),
# which every pull request reads, and older snapshots of the image are
# deleted. A scheduled night that fails in either profile opens an issue.
#
# Weekly, on main: the fresh audit, what proves the store's keys. The whole
# lane runs fresh with every reader (every group, nothing shared between
# documents), with every memo verified on every hit, every editor view rerun
# the slow way and every document's HQ branches held to fresh states, and
# without the readers; each is compared with main's newest snapshot (a record
# that differs is a key that missed an input, and fails the run with both
# records uploaded), and the two replace main's snapshot whole, so a key no
# current run reads leaves the store once a week. Three more runs hold the
# queue builder's fixed 24-document sample (a sampled run holds each register
# entry naming a document the sample left out on its control alone, and its
# verdict says so): a baseline; Nova's emission and HQ unseeded (their draws
# and clocks left real), compared with the baseline, which must change
# nothing but the masked values; and HQ's speed seams off (the XPath
# validator server, the settings memo, the cached templates), compared with
# it, which must change nothing. Each must hold, and a scheduled week that
# fails opens an issue.
#
# Every lane that runs the readers sizes its shards from its queue's measured
# cost (proof/run.mjs::sizedShards: no shard expected past two and a half
# hours) and runs at most fourteen at once, leaving six runners for pull
# requests. A dispatch runs the nightly, the weekly, or both, as its inputs
# say.
on:
  schedule:
    - cron: "23 3 * * *"
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly lanes (both profiles, against main's store)
        type: boolean
        default: true
      weekly:
        description: Run the weekly fresh audit and comparisons as well
        type: boolean
        default: false

permissions: {}

concurrency:
  group: proof-audit-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  # A dispatch that unticks both runs nothing, which must not read as an audit that passed.
  selection:
    name: Something is selected
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly != true && inputs.weekly != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::This dispatch selected neither the nightly audit nor the weekly comparisons."
          exit 1

  nightly:
    name: Nightly
    if: ${{ inputs.nightly == true || github.event.schedule == '23 3 * * *' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: audit
      fresh: false
      store: pack

  # The pull request lane's profile over main: the records and judgments every
  # pull request's lane reads for the groups it did not change.
  nightly-no-readers:
    name: Nightly, without the readers
    if: ${{ inputs.nightly == true || github.event.schedule == '23 3 * * *' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: audit-no-readers
      readers: false
      fresh: false
      store: pack

  # One snapshot of both profiles' records over main's, saved whatever either
  # verdict (as a single lane's save is), when every shard of both ran.
  save:
    name: Save main's store
    needs: [nightly, nightly-no-readers]
    if: ${{ !cancelled() && needs.nightly.result != 'skipped' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-store-save.yml
    with:
      base: true
      labels: |
        audit
        audit-no-readers

  # Keeps the newest two of main's snapshots of the image the audit ran, so a
  # pull request opened while the newest is being written still reads one.
  prune:
    name: Delete older snapshots
    needs: [save, weekly-save]
    if: ${{ always() && (needs.save.result == 'success' || needs.weekly-save.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof
      - name: Name the store's snapshots
        id: store
        run: node proof/ci/store-keys.mjs --arch amd64
      - name: Delete all but the newest two
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.store.outputs.main }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --sort created_at --order desc \
            --limit 100 --json key --jq '.[2:][].key' |
            while IFS= read -r key; do
              gh cache delete --repo "$GITHUB_REPOSITORY" "$key"
            done

  # A scheduled night that fails, in either profile, says so where it is seen.
  report:
    name: Report a failed night
    needs: [nightly, nightly-no-readers, save]
    if: ${{ failure() && github.event.schedule == '23 3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "The proof lane's nightly run failed" \
            --body "The nightly ran the proof lane over main, with every reader and without them, observing every group whose key changed since main's last snapshot, and it did not hold: a lane failed, or main's store could not be saved. The lane with every reader is the only one that runs Formplayer, the Web Apps client, CommCare Android and Connect, so a failure there is one no pull request's lane showed. The run: $RUN_URL"

  weekly-baseline:
    name: Weekly baseline
    if: ${{ github.event.schedule == '41 4 * * 0' || inputs.weekly == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: weekly-baseline
      documents: sample:24

  weekly-unseeded:
    name: Weekly, every clock and draw left real
    if: ${{ github.event.schedule == '41 4 * * 0' || inputs.weekly == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: weekly-unseeded
      documents: sample:24
      emission-env: PROOF_ENTROPY=real
      lane-env: PROOF_HQ_DETERMINISM=0

  weekly-unseamed:
    name: Weekly, HQ's speed seams off
    if: ${{ github.event.schedule == '41 4 * * 0' || inputs.weekly == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: weekly-unseamed
      documents: sample:24
      lane-env: PROOF_HQ_SPEED=0

  weekly-verified:
    name: Weekly, every memo verified, every view rerun, every branch held
    if: ${{ github.event.schedule == '41 4 * * 0' || inputs.weekly == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: weekly-verified
      # The fresh audit: every record compared with main's snapshot, then saved in place of it.
      store: pack
      lane-env: |
        PROOF_VERIFY_MEMOS=1
        PROOF_EDITOR_AUDIT=1
        PROOF_BRANCH_DOCUMENTS=all

  # The pull request lane's profile fresh, compared with main's snapshot: the audit of the keys every pull
  # request's lane reads, and that profile's half of the snapshot the week starts from.
  weekly-no-readers:
    name: Weekly, without the readers
    if: ${{ github.event.schedule == '41 4 * * 0' || inputs.weekly == true }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      label: weekly-no-readers
      readers: false
      store: pack

  # Both fresh lanes' records, replacing main's snapshot whole when every shard of both ran: a key no current run
  # reads leaves the store once a week, and the nights merge over this one.
  weekly-save:
    name: Save main's store from the fresh audit
    needs: [weekly-verified, weekly-no-readers]
    if: ${{ !cancelled() && needs.weekly-verified.result != 'skipped' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-store-save.yml
    with:
      labels: |
        weekly-verified
        weekly-no-readers

  weekly-compare:
    name: Weekly comparisons
    needs: [weekly-baseline, weekly-unseeded, weekly-unseamed, weekly-verified, weekly-no-readers]
    if: ${{ always() && needs.weekly-baseline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-out-weekly-*
          path: ${{ runner.temp }}/lanes
      # Each side is one lane run: --left and --right each take every shard
      # output that run uploaded, one directory per shard.
      #
      # Seeded and unseeded runs observe the same things up to the values the
      # seeding chooses (minted ids, CSRF tokens, clock readings): every
      # difference set must be equal once those are masked, and defects 1 and
      # 9 must still show in both.
      - name: Seeding changes nothing observed
        if: ${{ needs.weekly-unseeded.result == 'success' }}
        run: |
          python3 -m proof.store.audit compare --masked \
            --left "$RUNNER_TEMP"/lanes/proof-out-weekly-baseline-* \
            --right "$RUNNER_TEMP"/lanes/proof-out-weekly-unseeded-*
      - name: HQ's speed seams change nothing observed
        if: ${{ needs.weekly-unseamed.result == 'success' }}
        run: |
          python3 -m proof.store.audit compare \
            --left "$RUNNER_TEMP"/lanes/proof-out-weekly-baseline-* \
            --right "$RUNNER_TEMP"/lanes/proof-out-weekly-unseamed-*
      - name: Every weekly run held
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::These weekly runs did not hold: $failed. Each one's verdict artifact says why."
            exit 1
          fi

  # A scheduled week that fails says so where it is seen.
  weekly-report:
    name: Report a failed week
    needs: [weekly-compare, weekly-no-readers, weekly-save]
    if: ${{ always() && github.event.schedule == '41 4 * * 0' && (contains(needs.*.result, 'failure') || needs.weekly-compare.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "The proof lane's weekly audit failed" \
            --body "The weekly fresh audit recomputed the proof lane whole, with every reader and without them, and with its sampled comparisons it did not hold: a stored record differs from the fresh one (a key that missed an input; the run uploads both), a fresh lane or a comparison failed, or main's store could not be saved. The run: $RUN_URL"
