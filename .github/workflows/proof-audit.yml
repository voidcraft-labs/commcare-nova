name: Step 6 proof workflow confirmation
run-name: Confirm ${{ inputs.confirmation }} at 1630ff473ece
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Production workflow job to exercise on its pinned inputs
        type: choice
        required: true
        options: [retained, emission]
permissions: {}
jobs:
  emission:
    name: Emit the corpus and produce on ${{ matrix.arch }}
    if: ${{ inputs.confirmation == 'emission' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # The image's container sees this whole workspace, .git included, so the checkout keeps no credential there.
      - uses: actions/checkout@v7
        with:
          ref: 1630ff473ecee2b85675bb425a18e36189c89d94
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          # The registry sometimes resets a connection mid-download (ECONNRESET), which npm does not
          # retry; a reset is tried again, and any other failure, or a third reset, fails the step.
          for attempt in 1 2 3; do
            if npm install --global "npm@$npm_version" --ignore-scripts 2> "$RUNNER_TEMP/npm-self-install.log"; then break; fi
            cat "$RUNNER_TEMP/npm-self-install.log" >&2
            if [ "$attempt" = 3 ] || ! grep -q ECONNRESET "$RUNNER_TEMP/npm-self-install.log"; then exit 1; fi
          done
      - name: Install Nova's dependencies
        run: npm ci
      - name: Emit and produce on the runner and in the pinned image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          emit=(node --conditions=react-server --import ./proof/corpus/entropy.mts --import tsx proof/corpus/emit.ts --jobs 4)
          produce=(python3 -m proof.native.produce)
          "${emit[@]}" --out "$RUNNER_TEMP/runner"
          "${produce[@]}" --out "$RUNNER_TEMP/products/$ARCH-runner"
          image="$(jq -r .image proof/image.lock)"
          # The image compiles upstream Core at its pin, so it sees the checkout read-only and writes only into a
          # directory of its own (the emission's and the producers' Vitest runs write nothing under node_modules,
          # proof/corpus/emissionProcess.ts::VITEST_WRITER_OPTIONS), which is sealed before anything here reads it
          # (proof/ci/untrusted.mjs).
          mkdir -p "$RUNNER_TEMP/in-image"
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/in-image:/out" -w /work "$image" \
            "${emit[@]}" --out /out/image
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/in-image:/out" -w /work "$image" \
            "${produce[@]}" --out "/out/products/$ARCH-image"
          node proof/run.mjs --seal "$RUNNER_TEMP/in-image"
          digest() {
            (cd "$1" && find . -type f ! -path ./timings.json -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
              > "$RUNNER_TEMP/emission-$ARCH-$2.sha256"
          }
          digest "$RUNNER_TEMP/runner" runner
          digest "$RUNNER_TEMP/in-image/image" image
          tar -cf - -C "$RUNNER_TEMP/products" "$ARCH-runner" -C "$RUNNER_TEMP/in-image/products" "$ARCH-image" \
            | zstd -q -3 -T0 -o "$RUNNER_TEMP/products-$ARCH.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: proof-emission-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/emission-*.sha256
            ${{ runner.temp }}/products-*.tar.zst
          retention-days: 14

  emission-compare:
    name: The corpus and the products are the same on every architecture
    needs: emission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1630ff473ecee2b85675bb425a18e36189c89d94
          persist-credentials: false
          sparse-checkout: proof/ci
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-emission-*
          path: ${{ runner.temp }}/emissions
          merge-multiple: true
      - name: Compare every file's digest
        run: |
          cd "$RUNNER_TEMP/emissions"
          reference=emission-amd64-runner.sha256
          status=0
          for other in emission-*.sha256; do
            if ! diff -u "$reference" "$other" > "$other.diff"; then
              echo "::error::The corpus emitted as ${other%.sha256} differs from the one CI emits (${reference%.sha256}); the files whose digests differ:"
              cat "$other.diff"
              status=1
            fi
          done
          exit $status
      - name: Compare the products, but for the ids each production minted
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/products"
          for archive in "$RUNNER_TEMP"/emissions/products-*.tar.zst; do
            zstd -q -d -c "$archive" | tar -C "$RUNNER_TEMP/products" -xf -
          done
          reference="$RUNNER_TEMP/products/amd64-runner"
          status=0
          for other in amd64-image arm64-runner arm64-image; do
            if ! node proof/ci/products.mjs compare "$reference" "$RUNNER_TEMP/products/$other"; then
              echo "::error::The native products made on $other differ from the ones CI makes (amd64-runner); the lines above name each file and where it first differs."
              status=1
            fi
          done
          exit $status


  retained:
    name: Make the retained HQ answers and apps again at the new pins
    if: ${{ inputs.confirmation == 'retained' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1630ff473ecee2b85675bb425a18e36189c89d94
          persist-credentials: false
      - name: Prepare a pin-only candidate in a local repository
        id: pin-input
        env:
          RELEASE_SOURCE: 1630ff473ecee2b85675bb425a18e36189c89d94
          PREVIOUS_HQ: f57e85e029130ceb576ea6d0f389b744509de6c9
        run: |
          git config user.name 'Step 6 hosted proof'
          git config user.email 'proof@localhost'
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='proof/pins.json';
          const pins=JSON.parse(readFileSync(file,'utf8'));
          if (pins['commcare-hq'].commit===process.env.PREVIOUS_HQ) throw new Error('The fixture requires two distinct pins.');
          pins['commcare-hq'].commit=process.env.PREVIOUS_HQ;
          writeFileSync(file,JSON.stringify(pins,null,'\t')+'\n');
          JS
          git add -- proof/pins.json
          git commit -qm 'Set the previous HQ pin for the hosted job check'
          previous="$(git rev-parse HEAD)"
          git restore --source="$RELEASE_SOURCE" --staged --worktree -- proof/pins.json
          git commit -qm 'Restore the reviewed release pins'
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$RELEASE_SOURCE^{tree}")"
          git init -q --bare "$RUNNER_TEMP/pin-input.git"
          git -C "$RUNNER_TEMP/pin-input.git" fetch -q --no-tags --depth=2 "file://$GITHUB_WORKSPACE" "$candidate:refs/heads/trial-pins"
          git switch -q --detach "$previous"
          git remote set-url origin "file://$RUNNER_TEMP/pin-input.git"
          echo "commit=$candidate" >> "$GITHUB_OUTPUT"
      - name: Apply the planned pins
        env:
          PIN_COMMIT: ${{ steps.pin-input.outputs.commit }}
        run: node proof/upstream/pins.mjs apply "$PIN_COMMIT"
      - name: Verify the trial uses the reviewed source tree
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse '1630ff473ecee2b85675bb425a18e36189c89d94^{tree}')"
          git diff --exit-code
          git diff --exit-code --cached
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record the candidate image in the lock
        env:
          CANDIDATE: ghcr.io/voidcraft-labs/commcare-nova-proof@sha256:4807169c40a0e1e75b9f7732d1cb14746019ad64e48c8567c993b227a09bfaee
        run: node proof/ci/candidate.mjs --image "$CANDIDATE"
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          # The registry sometimes resets a connection mid-download (ECONNRESET), which npm does not
          # retry; a reset is tried again, and any other failure, or a third reset, fails the step.
          for attempt in 1 2 3; do
            if npm install --global "npm@$npm_version" --ignore-scripts 2> "$RUNNER_TEMP/npm-self-install.log"; then break; fi
            cat "$RUNNER_TEMP/npm-self-install.log" >&2
            if [ "$attempt" = 3 ] || ! grep -q ECONNRESET "$RUNNER_TEMP/npm-self-install.log"; then exit 1; fi
          done
      - run: npm ci
      - name: Emit the proof corpus
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          python3 -m proof.native.produce --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/logs/produce.log" 2>&1 &
          produce=$!
          trap 'kill "$produce" 2> /dev/null || true' EXIT
          node --conditions=react-server --import ./proof/corpus/entropy.mts \
            --import tsx proof/corpus/emit.ts --out "$RUNNER_TEMP/corpus" --jobs 4
          produced=0
          wait "$produce" || produced=$?
          cat "$RUNNER_TEMP/logs/produce.log"
          if [ "$produced" != 0 ]; then
            echo "::error::The native proofs' products could not be written (python3 -m proof.native.produce exited $produced); its output is above."
            exit 1
          fi
          mv -T "$RUNNER_TEMP/native" "$RUNNER_TEMP/corpus/native"
      - name: Run the tests that write what HQ made
        env:
          PROOF_READERS: '0'
          PROOF_CORPUS: ${{ runner.temp }}/corpus
          PROOF_OUT_DIR: ${{ runner.temp }}/retained-out
        run: |
          # Each test writes what HQ made before it holds the committed tree to it, so a hold that fails because
          # the new pins changed a tree (exit 1, an item failed) still leaves the new tree for adopt. Exit 1 is also
          # proof/run.mjs's own refusal before the lane starts; adopt then finds nothing written and refuses by
          # name. Any other exit is the lane's (proof/lane/serve.py: 2, it could not start; 3, a worker failed
          # during the run), which leaves trees no one can trust.
          code=0
          node proof/run.mjs proof/matrix/test_retained.py proof/hq/test_retained_reads.py \
            proof/editors/test_retained_reads.py || code=$?
          case $code in
            0|1) ;;
            6)
              echo "::error::The run that makes the retained trees wrote something other than plain files into its output, so nothing of it is adopted or uploaded; proof/run.mjs named each entry above and moved the output to retained-out.refused."
              exit "$code"
              ;;
            *)
              echo "::error::The run that makes the retained trees ended with exit $code before its tests finished; its output is above."
              exit "$code"
              ;;
          esac
      # The run's output as proof/run.mjs sealed it, sealed again here in case the run ended before it could; one
      # holding anything but plain files and directories is moved to retained-out.refused and is not uploaded.
      - name: Seal the run's output
        id: seal
        if: ${{ !cancelled() }}
        run: node proof/run.mjs --seal "$RUNNER_TEMP/retained-out"
      # Adopting takes every output of one run and merges them by file, through the retained layout
      # (proof/matrix/adopt.py). The run above is one run of the lane on this machine, which writes one output, so
      # that one is every output of it; proof/ci/__tests__/laneWorkflow.test.ts holds each adopting step to the
      # outputs its job's runs write.
      - name: Adopt what HQ made into the retained trees
        run: |
          mkdir -p "$RUNNER_TEMP/adopt"
          python3 -m proof.matrix.adopt "$RUNNER_TEMP/retained-out" --report --corpus "$RUNNER_TEMP/corpus" \
            > "$RUNNER_TEMP/adopt/adopt-report.txt"
          cat "$RUNNER_TEMP/adopt/adopt-report.txt"
          python3 -m proof.matrix.place pack proof "$RUNNER_TEMP/upstream-retained" \
            --report "$RUNNER_TEMP/adopt/adopt-report.txt"
      # A retained tree holds no hidden file (proof/matrix/retained-layout.json), so the upload carries none.
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-retained
          path: ${{ runner.temp }}/upstream-retained/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        with:
          name: upstream-retained-run
          path: |
            ${{ runner.temp }}/retained-out/
            ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 14


  verify-retained:
    name: Place the retained artifact in a fresh checkout and compare its files
    needs: retained
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1630ff473ecee2b85675bb425a18e36189c89d94
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: upstream-retained
          path: ${{ runner.temp }}/received
      - name: Accept the artifact through the production reader
        run: |
          mkdir -p "$RUNNER_TEMP/placed"
          python3 -m proof.matrix.place unpack "$RUNNER_TEMP/received" "$RUNNER_TEMP/placed"
          diff -qr proof/hq-apps "$RUNNER_TEMP/placed/hq-apps"
          diff -qr proof/hq-reads "$RUNNER_TEMP/placed/hq-reads"
