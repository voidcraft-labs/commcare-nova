name: Upstream pins

# The weekly pin pull request (proof/README.md, "Changing a pin"). Upstream
# changes reach Nova as one pull request a week that moves proof/pins.json to
# each upstream's default-branch head, with the image built at those pins
# (proof/image.lock) and the surface regenerated from them
# (lib/commcare/surface/surface.json), so every check runs against the new
# upstream code before a person adopts it by merging. There is only ever one
# such pull request: a week with new heads replaces its one commit, and a week
# with nothing new leaves it as it is, its description's date going stale.
#
# Before CI runs on the branch, the whole proof lane runs fresh on the
# candidate image and saves what it observed as main's evidence store for
# that image (proof-lane.yml), so the pin pull request's CI reads its records
# instead of observing every document again; this schedule's runs write the
# default branch's caches, which every pull request can read. The prewarm
# checks the tree the pull request will carry: the branch with the lock the
# report job commits (the candidate image and the new pins) and the
# regenerated surface, so its records and judgments are keyed as the pull
# request's own run looks them up.
#
# The workflow never merges. The jobs that run upstream code (the surface
# extraction, the prewarm) hold only a read token; the jobs that write run
# none.
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-pins
  cancel-in-progress: false

jobs:
  plan:
    name: Read the upstream heads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Commit the new pins to the pin branch
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          result="$(node proof/upstream/pins.mjs plan)"
          echo "$result"
          echo "action=$(echo "$result" | jq -r .action)" >> "$GITHUB_OUTPUT"

  image:
    name: Build the image at the new pins
    needs: plan
    if: ${{ needs.plan.outputs.action == 'update' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/proof-image.yml
    with:
      ref: upstream/pins

  surface:
    name: Regenerate the surface at the new pins
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/pins
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Extract the surface in the new image
        env:
          PROOF_IMAGE: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.image.outputs.digest }}
        run: |
          docker pull "$PROOF_IMAGE"
          node proof/run.mjs --surface
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-surface
          path: lib/commcare/surface/surface.json
          retention-days: 7

  prewarm:
    name: Prewarm main's evidence store for the candidate image
    needs: [image, surface]
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      ref: upstream/pins
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.image.outputs.digest }}
      surface: upstream-surface
      label: prewarm
      store: save
      # The pull request's own CI gives the verdict; a prewarm keeps what it
      # observed whatever it is.
      verdict: false

  report:
    name: Open or update the pin pull request
    needs: [plan, image, surface, prewarm]
    # Runs whenever the plan moved the pins, including when the image or the
    # surface failed: the pull request then carries the new pins alone and
    # names the failed step, and CI on it is red.
    if: ${{ always() && needs.plan.outputs.action == 'update' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        if: ${{ needs.surface.result == 'success' }}
        with:
          name: upstream-surface
          path: ${{ runner.temp }}/upstream-surface
      - name: Commit the lock and surface, and update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SURFACE_RESULT: ${{ needs.surface.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node proof/upstream/pins.mjs report \
            --image-result "$IMAGE_RESULT" \
            --digest "$DIGEST" \
            --surface-result "$SURFACE_RESULT" \
            --surface "$RUNNER_TEMP/upstream-surface/surface.json" \
            --run-url "$RUN_URL" \
            --reviewer bperry0xff
