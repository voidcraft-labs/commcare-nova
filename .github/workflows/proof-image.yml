name: Proof image

# Builds the proof harness image (proof/README.md) from proof/pins.json and its
# recipe (proof/image/), one native runner per architecture, pushes both to the
# GitHub Container Registry, and prints the multi-architecture digest that
# proof/image.lock records. It runs by hand for a change to the recipe, weekly,
# and is called by the weekly pin pull request (upstream-pins.yml) for new
# pins.
#
# The recipe builds two images from one build (proof/image/Dockerfile): `full`,
# everything its stages install, and `slim`, the default target, `full`
# without what the lane never opens, as one layer. Both are pushed with zstd
# layers, which a runner's Docker decompresses several times faster than gzip;
# the slim one is what the lock records and every lane run pulls. The two
# images' configurations are held equal here, since a scratch stage restates
# them.
#
# Weekly, and by hand (with no ref), it also proves the image's variants
# observe alike (proof-lane.yml, each lane fresh; python3 -m proof.store.audit
# compare pairs two runs' records by what they are):
#
# - without the readers, the whole lane on the slim image and on the full
#   image on amd64, and on the slim image on arm64: full against slim, and
#   arm64 against amd64. The arm64 image is published for a person's arm64
#   machine, and this is the run that holds the lane on it. The Android
#   reader runs on amd64 alone (its native runtime ships for no other
#   Linux), so the architectures are compared in the profile both run whole;
# - with every reader, on amd64, the slim image against the full one over
#   this week's sample of the corpus (python3 -m proof.store.queue
#   --sample-seed: 24 documents, turning each week, so every document is
#   compared within fifteen weeks), as the weekly audit's seeding and seam
#   comparisons are. The whole lane with every reader costs about 550
#   worker-hours, and the nightly and the weekly already run it on the slim
#   image; what this adds is the full image beside it.
#
# The lanes run one after another where they hold many runners, so the run
# never holds more than fourteen (the three without the readers are four
# shards each and run together). A scheduled run that fails opens an issue
# written from the lanes' verdicts (python3 -m proof.lane.report). It also
# emits the proof corpus and produces the native proofs' products (python3 -m
# proof.native.produce) on each architecture, on the runner and inside the
# pinned image, and holds the four alike, each to what CI ships (amd64, on
# the runner): the corpus's every file but timings.json byte for byte, and
# the products up to the ids their producers mint afresh in each production
# (proof/ci/products.mjs). CI makes both once, on an x64 runner with the
# runner's own Node, and the lane reads them on amd64 in the image.
#
# The image holds only public, licensed upstream sources and the recipe's own
# files, so the package is public; HQ's lock resolves its git and URL sources
# here, at build time, and nothing the image runs later reaches the network.
on:
  workflow_dispatch:
    inputs:
      sample_seed:
        description: The ISO year and week whose sample the readers' comparison checks (2026-W42); this week's when empty
        type: string
        default: ''
  # Monday, late afternoon: after the pin pull request's lanes (upstream-pins.yml, from 00:37) and before
  # Tuesday's night (proof-audit.yml), so no two workflows' lanes with the readers run at once
  # (proof/README.md, "The other workflows").
  schedule:
    - cron: "17 17 * * 1"
  workflow_call:
    inputs:
      ref:
        description: The commit or branch whose pins and recipe to build
        type: string
        required: true
    outputs:
      digest:
        description: The pushed multi-architecture digest of the slim image (what proof/image.lock records)
        value: ${{ jobs.publish.outputs.digest }}
      full-digest:
        description: The pushed multi-architecture digest of the full image
        value: ${{ jobs.publish.outputs.full-digest }}

permissions: {}

concurrency:
  group: proof-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/voidcraft-labs/commcare-nova-proof

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both targets in one builder: the slim one is pruned from the full
      # one's layers, which the second build reuses from the first.
      - name: Build and push both images by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mapfile -t build_args < <(node proof/image/build-args.mjs)
          for target in full slim; do
            docker buildx build \
              --platform "linux/$ARCH" \
              --file proof/image/Dockerfile \
              --target "$target" \
              "${build_args[@]}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true" \
              --metadata-file "$RUNNER_TEMP/metadata-$target.json" \
              .
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata-$target.json")"
            echo "$digest" > "$RUNNER_TEMP/digest-$target-$ARCH"
            echo "Pushed the $target image for linux/$ARCH as $IMAGE@$digest"
          done
      # A scratch stage inherits no configuration, so the slim stage restates
      # the full image's; a difference would run the lane differently.
      - name: The slim image is configured as the full one
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          config() {
            docker buildx imagetools inspect "$IMAGE@$(cat "$RUNNER_TEMP/digest-$1-$ARCH")" --format '{{json .Image}}' |
              jq -S '.config | {Env, Cmd, Entrypoint, User, WorkingDir: (.WorkingDir // "" | if . == "" then "/" else . end)}'
          }
          if ! diff <(config full) <(config slim); then
            echo "::error::The slim image's configuration differs from the full image's (above, full then slim). Restate the full stage's ENV, CMD, ENTRYPOINT, USER and WORKDIR in the slim stage of proof/image/Dockerfile."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: proof-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-*-${{ matrix.arch }}
          retention-days: 7

  publish:
    name: Publish the multi-architecture images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.slim }}
      full-digest: ${{ steps.publish.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect the manifest lists
        id: publish
        run: |
          commit="$(git rev-parse HEAD)"
          for target in slim full; do
            if [ "$target" = full ]; then tag="full-sha-$commit"; else tag="sha-$commit"; fi
            sources=()
            for file in "$RUNNER_TEMP"/digests/digest-"$target"-*; do
              sources+=("$IMAGE@$(cat "$file")")
            done
            docker buildx imagetools create --tag "$IMAGE:$tag" "${sources[@]}"
            digest="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$target=$digest" >> "$GITHUB_OUTPUT"
            echo "Published the $target image $IMAGE@$digest (tag $tag)"
            if [ "$target" = slim ]; then slim="$digest"; fi
          done
          {
            echo "### Proof image"
            echo
            echo "\`$IMAGE@$slim\` (tag \`sha-$commit\`), built from:"
            echo
            echo '```json'
            cat proof/pins.json
            echo '```'
            echo
            echo "Record the digest in proof/image.lock with the pins above."
          } >> "$GITHUB_STEP_SUMMARY"

  # The comparison's sample turns each week, as the weekly audit's does: the seed is the run's ISO year and
  # week, or the one a dispatch names to run a past week's sample again.
  sample:
    name: This week's comparison sample
    if: ${{ inputs.ref == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - id: seed
        env:
          NAMED: ${{ inputs.sample_seed }}
        run: |
          seed="${NAMED:-$(date -u +%G-W%V)}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "The readers' comparison checks the corpus sample the seed \`$seed\` chooses; each sampled lane's summary lists its documents. Dispatch this workflow with \`sample_seed=$seed\` to run the same sample again." >> "$GITHUB_STEP_SUMMARY"

  # Without the readers the whole lane is about four and a half worker-hours: the three run together, four
  # shards each, twelve runners.
  lane-slim:
    name: Lane on the slim image, without the readers
    needs: publish
    if: ${{ inputs.ref == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.publish.outputs.digest }}
      label: image-slim
      readers: false
      shards: '4'

  lane-full:
    name: Lane on the full image, without the readers
    needs: publish
    if: ${{ inputs.ref == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.publish.outputs.full-digest }}
      label: image-full
      readers: false
      shards: '4'

  # The arm64 image, on an arm64 runner: the corpus is emitted on x64, as CI emits it, and read here.
  lane-arm64:
    name: Lane on the slim image on arm64, without the readers
    needs: publish
    if: ${{ inputs.ref == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.publish.outputs.digest }}
      label: image-arm64
      readers: false
      shards: '4'
      runner: ubuntu-24.04-arm
      arch: arm64

  # With every reader, over the week's sample, one lane after the other and both after the three above: each
  # may hold fourteen runners. They run whatever the lanes before them found.
  lane-readers-slim:
    name: Lane on the slim image, every reader, over the week's sample
    needs: [publish, sample, lane-slim, lane-full, lane-arm64]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.sample.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.publish.outputs.digest }}
      label: image-readers-slim
      documents: sample:24
      sample-seed: ${{ needs.sample.outputs.seed }}

  lane-readers-full:
    name: Lane on the full image, every reader, over the week's sample
    needs: [publish, sample, lane-readers-slim]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.sample.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/proof-lane.yml
    with:
      image: ghcr.io/voidcraft-labs/commcare-nova-proof@${{ needs.publish.outputs.full-digest }}
      label: image-readers-full
      documents: sample:24
      sample-seed: ${{ needs.sample.outputs.seed }}

  lanes-compare:
    name: The image's variants observe alike
    needs: [lane-slim, lane-full, lane-arm64, lane-readers-slim, lane-readers-full]
    if: ${{ always() && needs.lane-slim.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-out-image-*
          path: ${{ runner.temp }}/lanes
      # Each side is one lane run: --left and --right each take every shard
      # output that run uploaded, one directory per shard. No label is the
      # start of another's, so each pattern takes one lane's.
      - name: The slim image observes what the full one does
        if: ${{ needs.lane-full.result == 'success' }}
        run: |
          python3 -m proof.store.audit compare \
            --left "$RUNNER_TEMP"/lanes/proof-out-image-full-* \
            --right "$RUNNER_TEMP"/lanes/proof-out-image-slim-*
      - name: arm64 observes what amd64 does
        if: ${{ !cancelled() && needs.lane-arm64.result == 'success' }}
        run: |
          python3 -m proof.store.audit compare \
            --left "$RUNNER_TEMP"/lanes/proof-out-image-slim-* \
            --right "$RUNNER_TEMP"/lanes/proof-out-image-arm64-*
      - name: The slim image's readers observe what the full one's do
        if: ${{ !cancelled() && needs.lane-readers-slim.result == 'success' && needs.lane-readers-full.result == 'success' }}
        run: |
          python3 -m proof.store.audit compare \
            --left "$RUNNER_TEMP"/lanes/proof-out-image-readers-full-* \
            --right "$RUNNER_TEMP"/lanes/proof-out-image-readers-slim-*
      - name: Every variant's lane held
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::These lanes did not hold: $failed. Each one's verdict artifact says why."
            exit 1
          fi

  emission:
    name: Emit the corpus and produce on ${{ matrix.arch }}
    if: ${{ inputs.ref == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          # The registry sometimes resets a connection mid-download (ECONNRESET), which npm does not
          # retry; a reset is tried again, and any other failure, or a third reset, fails the step.
          for attempt in 1 2 3; do
            if npm install --global "npm@$npm_version" --ignore-scripts 2> "$RUNNER_TEMP/npm-self-install.log"; then break; fi
            cat "$RUNNER_TEMP/npm-self-install.log" >&2
            if [ "$attempt" = 3 ] || ! grep -q ECONNRESET "$RUNNER_TEMP/npm-self-install.log"; then exit 1; fi
          done
      - name: Install Nova's dependencies
        run: npm ci
      - name: Emit and produce on the runner and in the pinned image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          emit=(node --conditions=react-server --import ./proof/corpus/entropy.mts --import tsx proof/corpus/emit.ts --jobs 4)
          produce=(python3 -m proof.native.produce)
          "${emit[@]}" --out "$RUNNER_TEMP/runner"
          "${produce[@]}" --out "$RUNNER_TEMP/products/$ARCH-runner"
          image="$(jq -r .image proof/image.lock)"
          # Writable: Vitest keeps its transform cache under node_modules.
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/out" -w /work "$image" \
            "${emit[@]}" --out /out/image
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP:/out" -w /work "$image" \
            "${produce[@]}" --out "/out/products/$ARCH-image"
          for where in runner image; do
            (cd "$RUNNER_TEMP/$where" && find . -type f ! -path ./timings.json -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum) > "$RUNNER_TEMP/emission-$ARCH-$where.sha256"
          done
          tar -C "$RUNNER_TEMP/products" -cf - . | zstd -q -3 -T0 -o "$RUNNER_TEMP/products-$ARCH.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: proof-emission-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/emission-*.sha256
            ${{ runner.temp }}/products-*.tar.zst
          retention-days: 14

  emission-compare:
    name: The corpus and the products are the same on every architecture
    needs: emission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof/ci
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-emission-*
          path: ${{ runner.temp }}/emissions
          merge-multiple: true
      - name: Compare every file's digest
        run: |
          cd "$RUNNER_TEMP/emissions"
          reference=emission-amd64-runner.sha256
          status=0
          for other in emission-*.sha256; do
            if ! diff -u "$reference" "$other" > "$other.diff"; then
              echo "::error::The corpus emitted as ${other%.sha256} differs from the one CI emits (${reference%.sha256}); the files whose digests differ:"
              cat "$other.diff"
              status=1
            fi
          done
          exit $status
      - name: Compare the products, but for the ids each production minted
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/products"
          for archive in "$RUNNER_TEMP"/emissions/products-*.tar.zst; do
            zstd -q -d -c "$archive" | tar -C "$RUNNER_TEMP/products" -xf -
          done
          reference="$RUNNER_TEMP/products/amd64-runner"
          status=0
          for other in amd64-image arm64-runner arm64-image; do
            if ! node proof/ci/products.mjs compare "$reference" "$RUNNER_TEMP/products/$other"; then
              echo "::error::The native products made on $other differ from the ones CI makes (amd64-runner); the lines above name each file and where it first differs."
              status=1
            fi
          done
          exit $status

  # A scheduled comparison that fails says so where it is seen, as a failed night or week of the audit does:
  # each lane's failing groups and the command that reruns each alone (python3 -m proof.lane.report). A call
  # for a ref (the pin pull request's build) runs no lane and never reaches this.
  report:
    name: Report a failed image comparison
    needs: [sample, lanes-compare, emission-compare]
    if: ${{ always() && inputs.ref == '' && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || needs.lanes-compare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof
      - name: Download the lanes' verdicts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: proof-lane-verdict-image-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdicts
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SAMPLE_SEED: ${{ needs.sample.outputs.seed }}
        run: |
          lanes=()
          for label in image-slim image-full image-arm64 image-readers-slim image-readers-full; do
            lanes+=(--lane "$label=$RUNNER_TEMP/verdicts/proof-lane-verdict-$label-$GITHUB_RUN_ATTEMPT/verdict/verdict.json")
          done
          seed=()
          if [ -n "$SAMPLE_SEED" ]; then seed=(--sample-seed "$SAMPLE_SEED"); fi
          python3 -m proof.lane.report --kind image --run "$RUN_URL" --commit "$GITHUB_SHA" "${lanes[@]}" \
            "${seed[@]}" --out "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "The proof image's weekly comparison failed" --body-file "$RUNNER_TEMP/issue.md"
