name: Proof lane

# The proof lane run whole, for the workflows that check the lane itself
# rather than a pull request: the nightly (proof-audit.yml), the weekly fresh
# audit and comparisons, the image comparisons (proof-image.yml) and the pin
# pull request's prewarm (upstream-pins.yml). Called only. It emits the corpus
# at `ref`, queues every group fresh with nothing shared between documents
# (python3 -m proof.store.queue --fresh --no-dedupe), or, with `fresh` false,
# as a pull request queues it, against main's newest store snapshot (a cached
# group runs nowhere and the gate holds its stored evidence; the audit sample
# is observed afresh), builds or finds the Android reader's runtime, runs the
# shards (`shards`: a count, or `auto`, as many as keep each shard's expected
# work within the profile's budget inside GitHub's six-hour job limit
# (proof/timings.json, execution.budget), each with a deadline from it,
# python3 -m proof.lane.plan size; at most fourteen of this call's at once,
# and past fourteen the count fills its last round) of `image`
# on `runner`, each handing every state it serves to a device beside HQ's live
# unit, holds the outputs to the lane's gate, and, as `store`
# asks, compares them with main's evidence store (a difference fails the run
# with both records uploaded) and saves them as main's newest snapshot, or
# packs them for the caller to merge with another call's and save
# (proof-store-save.yml).
#
# A document or control heavy enough is observed in pieces (proof/README.md,
# "Documents observed in pieces"): each configuration by a group of its own,
# on a worker of its own, and the document's own group after them judges it
# whole from the run's store. The queue builder decides which, by the
# profile's threshold (proof/timings.json, execution.split) or `split-above`.
#
# With `readers` false it runs the pull request lane's profile
# (proof/lane/readers.py, PROOF_READERS=0): no state is served to a reader,
# no test that starts one runs, and no Android runtime is built or mounted.
# The nightly audit runs both profiles over main, so a pull request whose
# lane runs without the readers finds the records of every group it did not
# change.
#
# Each artifact it writes carries `label`, so one run can call it several
# times (proof-image.yml compares five) without two calls' claims or outputs
# meeting.
#
# Fourteen at once is this call's bound, a matrix's, and the account runs
# twenty jobs at once. Six stay free for pull requests only where no two
# calls' shards run at once, which is the callers': each makes its calls
# wait for one another (`needs`), and the schedules keep the workflows apart
# (proof/README.md, "The other workflows", gives what each takes).
#
# A run of an image the checkout's lock does not name (`image`) records it in
# the lock first, in every job (proof/ci/candidate.mjs), so the queue's keys,
# the lane's and the store's cache names all name the image the shards pull;
# `surface` puts the surface the candidate's pull request will carry in place
# of the checkout's, so a prewarm checks the very tree that pull request will.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or branch to emit and check out (the caller's by default)
        type: string
        default: ''
      image:
        description: The image to run, pinned by digest (proof/image.lock's by default), recorded in the lock
        type: string
        default: ''
      surface:
        description: An artifact of this run holding the surface.json to check in place of the checkout's
        type: string
        default: ''
      runner:
        description: The shards' runner (amd64, where the Android reader runs beside HQ)
        type: string
        default: ubuntu-24.04
      arch:
        description: The shards' architecture, as the store's keys name it
        type: string
        default: amd64
      shards:
        description: How many shards run the lane, or auto (sized from the queues' estimates, python3 -m proof.lane.plan size)
        type: string
        default: auto
      fresh:
        description: Whether every group runs fresh with nothing shared (false queues the lane as a pull request does, against main's newest store snapshot)
        type: boolean
        default: true
      label:
        description: What the run's artifacts are named after
        type: string
        required: true
      lane-env:
        description: Extra variables for the lane, one NAME=VALUE a line (run.mjs passes through the names it lists)
        type: string
        default: ''
      emission-env:
        description: Extra variables for the corpus emission, one NAME=VALUE a line
        type: string
        default: ''
      documents:
        description: Which corpus documents to queue (all; sample:<n> for a sample of n the queue builder chooses; or only:<id>,<id> for those documents and their controls alone, which shows the lane on them and is no verdict on the corpus)
        type: string
        default: all
      split-above:
        description: The seconds of one worker past which an observed document or control is queued in pieces, one configuration a worker (the profile's execution.split in proof/timings.json when empty; 0 for every one under two configurations; none for no pieces)
        type: string
        default: ''
      sample-seed:
        description: The ISO year and week that chooses a sample's window of the corpus (2026-W42; the ranking's first n without one)
        type: string
        default: ''
      store:
        description: none, compare (with main's snapshot), save (compare, then save as main's newest), or pack (compare, then upload the packed snapshot as proof-store-<label>-<attempt> for proof-store-save.yml)
        type: string
        default: none
      readers:
        description: Whether the lane hands its served states to the readers (false is the pull request lane's profile, PROOF_READERS=0)
        type: boolean
        default: true
      verdict:
        description: Whether the gate's verdict fails the run (a prewarm on a pin branch keeps its records whatever it is)
        type: boolean
        default: true
      effects:
        description: Whether to hold the committed sensitivity effects to what this run's flips showed (a whole fresh lane only, which observes every document)
        type: boolean
        default: false
      claims:
        description: Proof allocation (static by default; create and steal are claim diagnostics)
        type: string
        default: static

permissions:
  contents: read

env:
  LABEL: ${{ inputs.label }}
  CANDIDATE: ${{ inputs.image }}
  # The lane's profile (proof/lane/readers.py): the queue builders are given it as a lane variable, and run.mjs
  # passes it into the harness.
  PROOF_READERS: ${{ inputs.readers && 'all' || '0' }}

jobs:
  emit:
    name: Emit and queue (${{ inputs.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record the candidate image in the lock
        if: ${{ inputs.image != '' }}
        run: node proof/ci/candidate.mjs --image "$CANDIDATE"
      - name: Put the candidate's surface in place
        if: ${{ inputs.surface != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.surface }}
          path: lib/commcare/surface
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          # The registry sometimes resets a connection mid-download (ECONNRESET), which npm does not
          # retry; a reset is tried again, and any other failure, or a third reset, fails the step.
          for attempt in 1 2 3; do
            if npm install --global "npm@$npm_version" --ignore-scripts 2> "$RUNNER_TEMP/npm-self-install.log"; then break; fi
            cat "$RUNNER_TEMP/npm-self-install.log" >&2
            if [ "$attempt" = 3 ] || ! grep -q ECONNRESET "$RUNNER_TEMP/npm-self-install.log"; then exit 1; fi
          done
      - run: npm ci
      - name: Emit the proof corpus
        env:
          EMISSION_ENV: ${{ inputs.emission-env }}
        run: |
          while IFS= read -r assignment; do
            [ -n "$assignment" ] && export "${assignment?}"
          done <<< "$EMISSION_ENV"
          mkdir -p "$RUNNER_TEMP/lane"
          python3 -m proof.native.produce --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/lane/produce.log" 2>&1 &
          produce=$!
          trap 'kill "$produce" 2> /dev/null || true' EXIT
          node --conditions=react-server --import ./proof/corpus/entropy.mts \
            --import tsx proof/corpus/emit.ts --out "$RUNNER_TEMP/corpus" --jobs 4
          produced=0
          wait "$produce" || produced=$?
          cat "$RUNNER_TEMP/lane/produce.log"
          if [ "$produced" != 0 ]; then
            echo "::error::The native proofs' products could not be written (python3 -m proof.native.produce exited $produced); its output is above."
            exit 1
          fi
          mv -T "$RUNNER_TEMP/native" "$RUNNER_TEMP/corpus/native"
      - name: Name the store's snapshots
        if: ${{ !inputs.fresh }}
        id: store
        env:
          ARCH: ${{ inputs.arch }}
        run: node proof/ci/store-keys.mjs --arch "$ARCH"
      - name: Restore main's evidence store
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Build the queues
        env:
          DOCUMENTS: ${{ inputs.documents }}
          SAMPLE_SEED: ${{ inputs.sample-seed }}
          SPLIT_ABOVE: ${{ inputs.split-above }}
          ARCH: ${{ inputs.arch }}
          LANE_ENV: ${{ inputs.lane-env }}
          FRESH: ${{ inputs.fresh }}
        run: |
          lane_arguments=(--lane-env "PROOF_READERS=$PROOF_READERS")
          while IFS= read -r assignment; do
            [ -n "$assignment" ] && lane_arguments+=(--lane-env "$assignment")
          done <<< "$LANE_ENV"
          # Fresh: every group observed again, nothing shared. Otherwise as a pull request's: against main's
          # store, documents sharing a part's inputs in one block, the audit sample chosen by the run's id.
          if [ "$FRESH" = true ]; then
            early=(--fresh)
            main=(--fresh --no-dedupe)
          else
            early=(--store "$RUNNER_TEMP/store/main")
            main=(--store "$RUNNER_TEMP/store/main" --audit-seed "$GITHUB_RUN_ID")
          fi
          # A sample's window of the corpus, where the caller names its seed; the builder writes the seed and the
          # sample into this job's summary, and the gate into its verdict.
          if [ -n "$SAMPLE_SEED" ]; then main+=(--sample-seed "$SAMPLE_SEED"); fi
          # The pieces' threshold, where the caller names one in the profile's place.
          if [ -n "$SPLIT_ABOVE" ]; then main+=(--split-above "$SPLIT_ABOVE"); fi
          python3 -m proof.store.queue early "${early[@]}" --timings proof/timings.json --arch "$ARCH" \
            "${lane_arguments[@]}" --out "$RUNNER_TEMP/lane/proof-early-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json"
          python3 -m proof.store.queue main "${main[@]}" --documents "$DOCUMENTS" \
            --corpus "$RUNNER_TEMP/corpus" --timings proof/timings.json --arch "$ARCH" "${lane_arguments[@]}" \
            --out "$RUNNER_TEMP/lane/proof-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json"
          tar -C "$RUNNER_TEMP/corpus" -cf - . |
            zstd -q -3 -T0 -o "$RUNNER_TEMP/lane/proof-corpus-$LABEL-$GITHUB_RUN_ATTEMPT.tar.zst"
      - name: Upload the corpus
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-corpus-${{ inputs.label }}-${{ github.run_attempt }}.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 3
      - name: Upload the early queue
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-early-queue-${{ inputs.label }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload the main queue
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-queue-${{ inputs.label }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
          RUNNER: ${{ inputs.runner }}
        run: |
          count="$SHARDS"
          deadline=()
          if [ "$count" = auto ]; then
            plan="$(python3 -m proof.lane.plan size \
              "$RUNNER_TEMP/lane/proof-early-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
              "$RUNNER_TEMP/lane/proof-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json")"
            echo "$plan"
            count="$(jq -r .shards <<< "$plan")"
            deadline=(--deadline "$(jq -r .deadline <<< "$plan")")
          fi
          matrix="$(node proof/run.mjs --matrix "$count" "${deadline[@]}" |
            jq -c --arg runner "$RUNNER" '.include[].runner = $runner')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  shard:
    name: Shard ${{ matrix.shard }}/${{ matrix.total }} (${{ inputs.label }})
    needs: [emit, android-runtime]
    # Without the readers the Android runtime job is skipped, and the shards run all the same.
    if: ${{ !cancelled() && needs.emit.result == 'success' && (needs.android-runtime.result == 'success' || (!inputs.readers && needs.android-runtime.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    # With the readers, each state a group serves goes to Formplayer and a
    # device, and every run is walked whole in the Web Apps client on a
    # desktop, on a phone and in App Preview, for every case of each list and
    # in every language the app holds. A sized matrix gives each shard twice
    # the work it is expected to run (python3 -m proof.lane.plan size); a
    # counted one, five and a half hours, which only ends a stuck shard.
    timeout-minutes: ${{ matrix.deadline || 330 }}
    strategy:
      fail-fast: false
      # Fourteen of this call's shards at once; the rest wait, and waiting is
      # no job's time. The bound is this matrix's alone: the callers keep two
      # calls' shards from running at once, which is what leaves six of the
      # account's twenty runners to pull requests.
      max-parallel: 14
      matrix: ${{ fromJSON(needs.emit.outputs.matrix) }}
    env:
      ATTEMPT: ${{ github.run_attempt }}
      SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            proof
            lib/commcare/surface
            .github/actions/proof-runtime
            .github/actions/proof-android-runtime
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record the candidate image in the lock
        if: ${{ inputs.image != '' }}
        run: node proof/ci/candidate.mjs --image "$CANDIDATE"
      - name: Put the candidate's surface in place
        if: ${{ inputs.surface != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.surface }}
          path: lib/commcare/surface
      - name: Pull the image and Postgres
        run: |
          image="$(jq -r .image proof/image.lock)"
          docker pull --quiet "$image" &
          pull=$!
          PROOF_IMAGE="$image" docker compose -f proof/compose.yaml pull --quiet postgres
          wait "$pull"
      - uses: ./.github/actions/proof-runtime
      # The Android reader's runtime and its JDK, mounted into the harness at the paths they have here.
      - id: android
        if: ${{ inputs.readers }}
        uses: ./.github/actions/proof-android-runtime
      - name: Download the early queue
        uses: actions/download-artifact@v8
        with:
          name: proof-early-queue-${{ inputs.label }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/lane
      # A lane queued against main's store reads it, as a pull request's does (PROOF_STORE, read-only).
      - name: Name the store's snapshots
        if: ${{ !inputs.fresh }}
        id: store
        env:
          ARCH: ${{ inputs.arch }}
        run: node proof/ci/store-keys.mjs --arch "$ARCH"
      - name: Restore main's evidence store
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Prepare the shard's evidence store
        if: ${{ !inputs.fresh }}
        run: |
          # A cache miss is an empty store, including the first night for an image.
          # Keep a restored snapshot intact; run.mjs deliberately refuses a missing named directory.
          mkdir -p "$RUNNER_TEMP/store/main"
      - name: Proof lane
        env:
          PROOF_CORPUS: ${{ runner.temp }}/corpus
          PROOF_STORE: ${{ !inputs.fresh && format('{0}/store/main', runner.temp) || '' }}
          PROOF_OUT_DIR: ${{ runner.temp }}/proof-out
          WORKERS: ${{ matrix.workers }}
          LANE_ENV: ${{ inputs.lane-env }}
          CLAIMS: ${{ inputs.claims }}
          PROOF_ANDROID_RUNTIME: ${{ steps.android.outputs.runtime }}
        run: |
          if [ -n "$PROOF_ANDROID_RUNTIME" ]; then export PROOF_ANDROID_JDK="$JAVA_HOME"; fi
          while IFS= read -r assignment; do
            [ -n "$assignment" ] && export "${assignment?}"
          done <<< "$LANE_ENV"
          case "$CLAIMS" in
            static) claim=(--claim static --bin "$SHARD") ;;
            steal) claim=(--claim "node proof/ci/claim.mjs --mode steal --shard $SHARD --by $LABEL-shard-$SHARD --listing-cache /tmp/proof-claims.json proof-claim-$LABEL-$ATTEMPT-{block}" --bin "$SHARD") ;;
            *) claim=(--claim "node proof/ci/claim.mjs --by $LABEL-shard-$SHARD --listing-cache /tmp/proof-claims.json proof-claim-$LABEL-$ATTEMPT-{block}" --bin "$SHARD") ;;
          esac
          set +e
          node proof/run.mjs --lane --label "$LABEL-shard-${SHARD%/*}" --workers "$WORKERS" \
            --early-queue "$RUNNER_TEMP/lane/proof-early-queue-$LABEL-$ATTEMPT.json" \
            --queue "$RUNNER_TEMP/lane/queue/queue.json" \
            "${claim[@]}" \
            --wait-for "node proof/ci/wait.mjs --queue proof-queue-$LABEL-$ATTEMPT.json --corpus proof-corpus-$LABEL-$ATTEMPT.tar.zst --failed proof-emission-failed-$LABEL-$ATTEMPT --deadline 1800" \
            --command-env ACTIONS_RUNTIME_TOKEN,ACTIONS_RESULTS_URL
          code=$?
          case $code in 0|1) exit 0 ;; *) exit $code ;; esac
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: proof-out-${{ inputs.label }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/proof-out/
          if-no-files-found: error
          retention-days: 14

  # The Android reader's runtime (proof/android/README.md), kept under the
  # digest of everything a build of it reads: built where no cache entry
  # holds it, and held to the reader's own checks, before any shard starts.
  android-runtime:
    name: Android reader runtime (${{ inputs.label }})
    if: ${{ inputs.readers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            proof
            .github/actions/proof-android-runtime
      - uses: ./.github/actions/proof-android-runtime
        with:
          build: 'true'

  gate:
    name: Verdict and store (${{ inputs.label }})
    needs: [emit, shard]
    if: ${{ always() && needs.emit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            proof
            lib/commcare/surface
      - name: Record the candidate image in the lock
        if: ${{ inputs.image != '' }}
        run: node proof/ci/candidate.mjs --image "$CANDIDATE"
      - name: Put the candidate's surface in place
        if: ${{ inputs.surface != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.surface }}
          path: lib/commcare/surface
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-out-${{ inputs.label }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      - uses: actions/download-artifact@v8
        with:
          pattern: proof-*queue-${{ inputs.label }}-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/queues
          merge-multiple: true
      # Main's store: what a lane queued against it reads its cached groups' evidence from, and what every
      # record a lane observes is compared with.
      - name: Name the store's snapshots
        if: ${{ inputs.store != 'none' || !inputs.fresh }}
        id: store
        env:
          ARCH: ${{ inputs.arch }}
        # The key a `store: save` writes names this call, so two calls that save in one run keep two snapshots.
        run: node proof/ci/store-keys.mjs --arch "$ARCH" --save "$LABEL"
      - name: Restore main's evidence store
        if: ${{ inputs.store != 'none' || !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: The shards ran every block once and held every difference to the register
        id: verdict
        continue-on-error: ${{ !inputs.verdict }}
        env:
          FRESH: ${{ inputs.fresh }}
        run: |
          shopt -s nullglob
          # A lane queued against main's store reads its cached groups' evidence from it.
          store=()
          if [ "$FRESH" != true ]; then store=(--store "$RUNNER_TEMP/store/main"); fi
          python3 -m proof.lane.gate \
            "$RUNNER_TEMP"/proof-shards/proof-out-* \
            --early-queue "$RUNNER_TEMP/queues/proof-early-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
            --queue "$RUNNER_TEMP/queues/proof-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
            "${store[@]}" --summary "$RUNNER_TEMP/verdict/verdict.json"
      # What no check of one document can see: an effect the gates file names that no flip shows any longer.
      # A whole fresh lane observed every document, so its evidence holds the file both ways (python3 -m
      # proof.checks.sensitivity held): each effect the file names that no flip showed, and each a flip showed
      # that the file lacks, fails here by name, and is written beside the verdict for the week's issue.
      - name: The committed sensitivity effects are what this run's flips showed
        if: ${{ !cancelled() && inputs.effects }}
        run: |
          shopt -s nullglob
          python3 -m proof.checks.sensitivity held "$RUNNER_TEMP"/proof-shards/proof-out-*/blocks/* \
            --queue "$RUNNER_TEMP/queues/proof-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
            --summary "$RUNNER_TEMP/verdict/effects.json"
      # The store is held to whatever ran, whatever the verdict: a failing
      # item on main still observes records, and a key that missed an input
      # shows only here.
      # Every record the store holds for a part this run observed must be the
      # record this run made; a difference is a key that missed an input. An
      # absent store (none saved yet for this image) holds nothing to differ.
      - name: Compare the fresh records with main's store
        if: ${{ !cancelled() && inputs.store != 'none' }}
        run: |
          shopt -s nullglob
          python3 -m proof.store.audit compare --store "$RUNNER_TEMP/store/main" \
            --mismatches "$RUNNER_TEMP/audit" \
            "$RUNNER_TEMP"/proof-shards/proof-out-*
      # Saved whatever the verdict and the comparison (fresh records are what
      # the lane observes, so they replace the store even where a stored one
      # was wrong), but only when every shard ran: a shard that could not run
      # leaves its blocks' records out, and main's previous snapshot is kept
      # rather than replaced by one that lacks them.
      - name: Pack the fresh store
        if: ${{ !cancelled() && (inputs.store == 'save' || inputs.store == 'pack') && needs.shard.result == 'success' && steps.store.outputs.key != '' }}
        id: pack
        env:
          FRESH: ${{ inputs.fresh }}
          STORE: ${{ inputs.store }}
        run: |
          shopt -s nullglob
          python3 -m proof.store.pack pack --out "$RUNNER_TEMP/store/next" \
            --queue "$RUNNER_TEMP/queues/proof-early-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
            --queue "$RUNNER_TEMP/queues/proof-queue-$LABEL-$GITHUB_RUN_ATTEMPT.json" \
            "$RUNNER_TEMP"/proof-shards/proof-out-*
          # A lane queued against main's store observed only what it lacked: a snapshot it saves itself holds
          # main's beside it. A packed one is merged with main's by proof-store-save.yml.
          if [ "$FRESH" != true ] && [ "$STORE" = save ]; then
            python3 -m proof.store.pack merge --into "$RUNNER_TEMP/store/next" \
              "$RUNNER_TEMP/store/main" "$RUNNER_TEMP/store/next"
          fi
      - name: Save main's newest snapshot
        if: ${{ !cancelled() && inputs.store == 'save' && steps.pack.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/store/next
          key: ${{ steps.store.outputs.key }}
      # The caller merges it with its other calls' (proof-store-save.yml), so the run saves one snapshot.
      - name: Upload the packed store
        if: ${{ !cancelled() && inputs.store == 'pack' && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: proof-store-${{ inputs.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store/next/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: proof-lane-verdict-${{ inputs.label }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verdict/
            ${{ runner.temp }}/audit/
          if-no-files-found: ignore
          retention-days: 30
