name: CI

# Runs the quality gate the local git hooks enforce, plus a production build,
# on every pull request. This is what actually verifies Dependabot's
# dependency-bump PRs before anyone merges them.
#
# No push:[main] trigger on purpose: the branch ruleset requires PRs to be up to
# date with main before merging, so the PR run already verified the exact commit
# that lands — a re-run on main would be redundant. It also couldn't gate the
# deploy, since the Cloud Build trigger (cloudbuild.yaml) fires on the same push
# independently and never waited on this workflow.
on:
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN: every job here only reads the repo to
# build and test it — none push, comment, or publish — so the default token
# scope is narrowed to read-only across the whole workflow.
permissions:
  contents: read

# `.nvmrc` is canonical for Node; package.json's `devEngines` is canonical for
# npm and mirrors Node so npm can enforce both before commands run. Every setup
# below reads those versions, and the `quality` guard asserts the Dockerfile and
# package metadata match, so CI, the deployed image, and local tooling can't
# drift. Pin the exact production patches: the floating `22` major silently
# advanced to 22.23.0, whose undici regression took prod login down (#143), and
# a green CI on a different patch would have masked it. Bump `.nvmrc` and its
# mirrors together; the guard flags any drift.

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enforce both sources of truth. A runtime drift here is the #143 class —
      # CI green on different tooling than the production image ships.
      - name: Runtime versions are single-sourced
        run: |
          nvmrc="$(cat .nvmrc)"
          docker_node="$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9.]*\)-.*/\1/p' Dockerfile)"
          package_node="$(jq -r '.devEngines.runtime.version' package.json)"
          package_npm="$(jq -r '.devEngines.packageManager.version' package.json)"
          docker_npm="$(sed -n 's/^ARG NPM_VERSION=\([0-9.]*\).*/\1/p' Dockerfile)"
          if [ "$nvmrc" != "$docker_node" ] || [ "$nvmrc" != "$package_node" ]; then
            echo "::error::Node drift: .nvmrc=$nvmrc, package.json=$package_node, Dockerfile=$docker_node. Update both mirrors to match .nvmrc."
            exit 1
          fi
          if [ "$package_npm" != "$docker_npm" ]; then
            echo "::error::npm drift: package.json=$package_npm but the Dockerfile pins $docker_npm. Update the Dockerfile ARG NPM_VERSION to match package.json."
            exit 1
          fi
          echo "Node $nvmrc and npm $package_npm are pinned consistently."
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node's npm cache lookup runs before we can replace the npm 11
          # bundled with Node 24, so the exact npm 12 devEngine rejects it.
          package-manager-cache: false
      - name: Runtime capabilities are single-sourced
        run: node scripts/rollout/render-build-config.mjs --check
      # The testcontainers harness and `compose.yaml` must name one Postgres
      # image, or `npm run dev` runs a different engine than the suite that
      # gates the merge — invisible until a version-dependent behavior differs.
      - name: Postgres test image is single-sourced
        run: node scripts/ci/print-test-image.mjs --check
      # A raw NUL byte anywhere in a text file defeats the text/binary sniff
      # every code-search tool relies on. `grep` then exits "no match" — not
      # even "Binary file matches" — for a symbol defined in that file, and
      # ripgrep replaces the hits with a one-line binary notice. Search stops
      # answering truthfully, which is how a sweep concludes a live function
      # has no callers. Review can't catch it either: git renders the byte as
      # a space, so the line looks ordinary in a diff. The `\u0000` escape is
      # the identical string at runtime and keeps the file text.
      - name: Source files carry no raw NUL bytes
        run: |
          offenders="$(git ls-files -z -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.mts' '*.cjs' '*.cts' \
            '*.json' '*.jsonc' '*.md' '*.mdx' '*.css' '*.yml' '*.yaml' \
            | xargs -0 -r perl -ne 'if (/\0/) { print "$ARGV\n"; close ARGV }')"
          if [ -n "$offenders" ]; then
            printf '%s\n' "$offenders" | sed 's/^/  /'
            echo "::error::Scanned every tracked source file for a raw NUL byte and found one in each file listed above. Source files must contain no raw NUL: it makes grep report no match at all for symbols that are present and makes ripgrep skip the file, so code search silently lies about what the file contains — and because a diff renders the byte as a space, review does not catch it. Write the escape \\u0000 instead; it produces an identical string at runtime and leaves the file searchable."
            exit 1
          fi
          echo "No raw NUL bytes in tracked source files."
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  test:
    # Every test runs once, in isolated workers. Shared database templates avoid
    # reinstalling extensions and replaying migrations for each behavior test.
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # Each shard boots its own Postgres testcontainer and applies the
      # case-store migrations in-process via Kysely's Migrator
      # (lib/case-store/sql/__tests__/applyMigrations.ts), so no migration CLI
      # is needed on PATH. ubuntu-latest already runs a Docker daemon for the
      # container itself.
      - uses: ./.github/actions/pull-test-image
      - name: Test suite
        run: npm test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=./scripts/ci/test-timings.ts
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-results/timings.json
          retention-days: 14

  tests-gate:
    # The branch ruleset requires a check literally named "Tests"; the shard
    # jobs above report per-shard names, so this fan-in is the required check.
    # `always()` keeps it from being skipped when a shard fails — GitHub
    # treats a skipped required check as passing.
    name: Tests
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Every test shard succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test shards finished with result '${{ needs.test.result }}'. Open the failing shard job for the vitest output."
            exit 1
          fi
          echo "All test shards passed."

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Generate the same image declarations Cloud Build renders. The UUID is
      # synthetic deployment identity, not a credential, and keeps the final
      # image contract valid without borrowing production state.
      - name: Render CI image configuration
        run: |
          ci_build_id="$(cat /proc/sys/kernel/random/uuid)"
          node scripts/rollout/render-build-config.mjs \
            --check \
            --build-id "$ci_build_id" \
            --output "$RUNNER_TEMP/rollout.env"
          echo "NOVA_CI_BUILD_ID=$ci_build_id" >> "$GITHUB_ENV"
      # This intentionally builds the final runner stage from the filtered
      # Docker context. Production-only values are replaced with synthetics;
      # no image is pushed and no source maps are uploaded.
      - name: Install reviewed Buildx
        run: bash scripts/rollout/install-buildx.sh
      - name: Build deployable image
        run: |
          source "$RUNNER_TEMP/rollout.env"
          export NOVA_IMAGE_TAG="commcare-nova:ci-$GITHUB_SHA"
          export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="ci-not-a-real-google-maps-key"
          export NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID="ac18fb2d87e44a1eb5a19883"
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export NEXT_DEPLOYMENT_ID="$NOVA_CI_BUILD_ID"
          bash scripts/rollout/build-image.sh

  smoke:
    name: Smoke shard ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
      # Cache the Chromium binary (~150MB) so it isn't re-downloaded every run.
      # Keyed on the whole lockfile (coarse — any dep bump re-saves, but
      # restore-keys still serves the existing binary, so no re-download).
      # `--with-deps` still installs the (apt) OS deps, which are fast.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright (Chromium + OS deps)
        run: npx playwright install --with-deps chromium
      # Hermetic: local Postgres + seeded session. No real GCP, no prod
      # credentials, no LLM spend. Runs the credential-free `public` checks and
      # the seeded-session `authed` checks. This catches UI / route / render /
      # session-contract breaks — but NOT the outbound dependency breaks (the
      # local stack networks nothing out); the `auth-healthz` job below is the
      # gate for those.
      - name: Smoke suite
        run: npm run test:smoke -- --project=public --project=authed --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7

  smoke-gate:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ always() }}
    steps:
      - name: Every smoke shard succeeded
        env:
          RESULT: ${{ needs.smoke.result }}
        run: test "$RESULT" = success

  auth-healthz:
    # The required-check NAME below ("Auth Firestore healthz") is PINNED by the
    # branch ruleset — keep it verbatim even though the job no longer probes
    # Firestore. It now runs ONE probe over the real outbound HTTP stack on the
    # prod-pinned Node (the local-Postgres smoke can't catch this class): the
    # auth credential path — login runs through the Cloud SQL connector, which
    # mints its cert + IAM token via google-auth-library → gaxios → node-fetch
    # (the #143/#145 outage class). scripts/ci/auth-healthz.ts exercises that
    # stack directly (a WIF token mint, no database). Its failure reds this
    # required gate.
    name: Auth Firestore healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WIF needs to mint an OIDC token; everything else stays read-only. Job-level
    # permissions REPLACE the workflow default, so `contents: read` is restated
    # for checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # Keyless auth to the isolated commcare-nova-ci project: GitHub's OIDC
      # token is exchanged via Workload Identity Federation for a CI service
      # account whose ONLY access is that dataless project. No long-lived keys
      # exist anywhere; the WIF provider is org-restricted and the SA is bound
      # only to this repo.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.CI_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      # Auth credential path: mint a token over the prod outbound stack. A
      # regression there (undici / gaxios / node-fetch keep-alive) throws or hangs
      # here and reds the PR.
      - name: Auth credential — token mint over the prod outbound stack
        run: npx tsx scripts/ci/auth-healthz.ts

  auth-contract:
    # Gates the session-cookie contract (a forged cookie ⇄ the real
    # better-auth / better-call session read path) on every PR. The test seeds +
    # asserts against Better Auth's Kysely/Postgres adapter on a per-test
    # testcontainer database (booted by the case-store vitest globalSetup) — no
    # emulator, no ADC. See lib/db/__tests__/sessionCookie.integration.test.ts.
    name: Auth session-cookie contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
      - name: Session-cookie contract (Postgres testcontainer)
        run: node_modules/.bin/vitest run sessionCookie.integration.test.ts
