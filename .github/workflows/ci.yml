name: CI

# Runs the quality gate the local git hooks enforce, plus a production build,
# on every pull request. This is what actually verifies Dependabot's
# dependency-bump PRs before anyone merges them.
#
# No push:[main] trigger on purpose: the branch ruleset requires PRs to be up to
# date with main before merging, so the PR run already verified the exact commit
# that lands — a re-run on main would be redundant. It also couldn't gate the
# deploy, since the Cloud Build trigger (cloudbuild.yaml) fires on the same push
# independently and never waited on this workflow.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_jobs:
        description: Total smoke jobs for a controlled comparison
        type: choice
        options: [default, '4', '6']
        default: default
      smoke_workers:
        description: Workers per smoke job
        type: choice
        options: [default, '1', '2']
        default: default
      proof_shards:
        description: Proof jobs for a controlled comparison
        type: choice
        options: [default, '2', '3', '4', '6', '8', '12', '14', '16']
        default: default
      proof_claims:
        description: Proof allocation (static by default; create and steal are claim diagnostics)
        type: choice
        options: [default, create, steal, static]
        default: default
      android_shards:
        description: Android stage jobs for a controlled comparison
        type: choice
        options: [default, '1', '2', '4', '8', '12', '16', '24', '32']
        default: default
      android_from_run:
        description: Also run the Android stage again over this earlier CI run's proof shards (its run id; proof-android.yml)
        type: string
        default: ''

# A newer push to the same branch/PR cancels the in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN: every job here only reads the repo to
# build and test it — none push, comment, or publish — so the default token
# scope is narrowed to read-only across the whole workflow.
permissions:
  contents: read

# Static allocation divides blocks into exclusive bins by estimated load
# (proof.checks.sharding.static_bins), without artifact claims. GitHub's
# artifact service has accepted duplicate claim names and omitted finalized
# markers from subsequent listings, so `create` and `steal` remain explicit
# diagnostic choices. The manual proof-claim-race.yml measures those service
# assumptions; the aggregate gate rejects every duplicate or missing block.
env:
  PROOF_CLAIMS: ${{ inputs.proof_claims != 'default' && inputs.proof_claims || 'static' }}

# `.nvmrc` is canonical for Node; package.json's `devEngines` is canonical for
# npm and mirrors Node so npm can enforce both before commands run. Every setup
# below reads those versions, and the `quality` guard asserts the Dockerfile and
# package metadata match, so CI, the deployed image, and local tooling can't
# drift. Pin the exact production patches: the floating `22` major silently
# advanced to 22.23.0, whose undici regression took prod login down (#143), and
# a green CI on a different patch would have masked it. Bump `.nvmrc` and its
# mirrors together; the guard flags any drift.

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enforce both sources of truth. A runtime drift here is the #143 class —
      # CI green on different tooling than the production image ships.
      - name: Runtime versions are single-sourced
        run: |
          nvmrc="$(cat .nvmrc)"
          docker_node="$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9.]*\)-.*/\1/p' Dockerfile)"
          package_node="$(jq -r '.devEngines.runtime.version' package.json)"
          package_npm="$(jq -r '.devEngines.packageManager.version' package.json)"
          docker_npm="$(sed -n 's/^ARG NPM_VERSION=\([0-9.]*\).*/\1/p' Dockerfile)"
          if [ "$nvmrc" != "$docker_node" ] || [ "$nvmrc" != "$package_node" ]; then
            echo "::error::Node drift: .nvmrc=$nvmrc, package.json=$package_node, Dockerfile=$docker_node. Update both mirrors to match .nvmrc."
            exit 1
          fi
          if [ "$package_npm" != "$docker_npm" ]; then
            echo "::error::npm drift: package.json=$package_npm but the Dockerfile pins $docker_npm. Update the Dockerfile ARG NPM_VERSION to match package.json."
            exit 1
          fi
          echo "Node $nvmrc and npm $package_npm are pinned consistently."
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node's npm cache lookup runs before we can replace the npm 11
          # bundled with Node 24, so the exact npm 12 devEngine rejects it.
          package-manager-cache: false
      - name: Runtime capabilities are single-sourced
        run: node scripts/rollout/render-build-config.mjs --check
      # The testcontainers harness and `compose.yaml` must name one Postgres
      # image, or `npm run dev` runs a different engine than the suite that
      # gates the merge — invisible until a version-dependent behavior differs.
      - name: Postgres test image is single-sourced
        run: node scripts/ci/print-test-image.mjs --check
      # The proof lane pulls the image proof/image.lock records; that image
      # must have been built from the upstream commits proof/pins.json names,
      # or every native proof would run against code the pins do not name.
      - name: Proof image matches the pins
        run: node scripts/ci/check-proof-image-lock.mjs
      # A raw NUL byte anywhere in a text file defeats the text/binary sniff
      # every code-search tool relies on. `grep` then exits "no match" — not
      # even "Binary file matches" — for a symbol defined in that file, and
      # ripgrep replaces the hits with a one-line binary notice. Search stops
      # answering truthfully, which is how a sweep concludes a live function
      # has no callers. Review can't catch it either: git renders the byte as
      # a space, so the line looks ordinary in a diff. The `\u0000` escape is
      # the identical string at runtime and keeps the file text.
      - name: Source files carry no raw NUL bytes
        run: |
          # shellcheck disable=SC2016 # perl's own variables, not the shell's
          offenders="$(git ls-files -z -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.mts' '*.cjs' '*.cts' \
            '*.json' '*.jsonc' '*.md' '*.mdx' '*.css' '*.yml' '*.yaml' \
            | xargs -0 -r perl -ne 'if (/\0/) { print "$ARGV\n"; close ARGV }')"
          if [ -n "$offenders" ]; then
            printf '%s\n' "$offenders" | sed 's/^/  /'
            echo "::error::Scanned every tracked source file for a raw NUL byte and found one in each file listed above. Source files must contain no raw NUL: it makes grep report no match at all for symbols that are present and makes ripgrep skip the file, so code search silently lies about what the file contains — and because a diff renders the byte as a space, review does not catch it. Write the escape \\u0000 instead; it produces an identical string at runtime and leaves the file searchable."
            exit 1
          fi
          echo "No raw NUL bytes in tracked source files."
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # The proof lane's corpus (proof/corpus/emit.ts): every document the
      # lane checks, with its exports, captures and input manifest, emitted
      # once here from the commit, where Nova's node_modules already are, and
      # handed to the proof shards (which run no Nova TypeScript) as one
      # artifact. The entropy preload seeds every minted identity, so the same
      # commit emits the same bytes. Beside it, the native proofs' products
      # (python3 -m proof.native.produce: each family's producer and the
      # publish capture, also Nova's TypeScript) go into the corpus as
      # native/, which the shards read in place of producing them.
      #
      # The proof steps never fail this job: lint and type-check below run
      # whatever they do, and a failed emission reaches the lane instead,
      # through the failure marker (the shards stop waiting, and "Proofs"
      # names the step that failed).
      - name: Emit the proof corpus
        id: emit
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/lane"
          python3 -m proof.native.produce --out "$RUNNER_TEMP/native" > "$RUNNER_TEMP/lane/produce.log" 2>&1 &
          produce=$!
          trap 'kill "$produce" 2> /dev/null || true' EXIT
          node --conditions=react-server --import ./proof/corpus/entropy.mts \
            --import tsx proof/corpus/emit.ts --out "$RUNNER_TEMP/corpus" --jobs 4
          produced=0
          wait "$produce" || produced=$?
          cat "$RUNNER_TEMP/lane/produce.log"
          if [ "$produced" != 0 ]; then
            echo "::error::The native proofs' products could not be written (python3 -m proof.native.produce exited $produced); its output is above."
            exit 1
          fi
          # -T: a corpus document named native would be refused, not merged into.
          mv -T "$RUNNER_TEMP/native" "$RUNNER_TEMP/corpus/native"
      - name: Name the proof lane's store snapshots
        id: store
        if: ${{ steps.emit.outcome == 'success' }}
        continue-on-error: true
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Restore main's evidence store
        if: ${{ steps.store.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        if: ${{ steps.store.outcome == 'success' && steps.store.outputs.scope != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      # The main queue: every document's and control's groups and the
      # packages whose tests read the corpus or its products
      # (proof.lane.blocks.CORPUS_PACKAGES), packed into blocks, each group either
      # queued fresh or read from the store when every one of its judgments is
      # keyed there, and the audit sample recomputed. A store the restores
      # did not find (a first run, or a miss) is read as empty.
      - name: Build the proof queue
        id: build
        if: ${{ steps.store.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 -m proof.store.queue main
          --corpus "$RUNNER_TEMP/corpus"
          --store "$RUNNER_TEMP/store/main" --store "$RUNNER_TEMP/store/scope"
          --timings proof/timings.json --arch arm64
          --audit-seed "$GITHUB_RUN_ID"
          --out "$RUNNER_TEMP/lane/proof-queue-$GITHUB_RUN_ATTEMPT.json"
      # The Android queue: each document's Android group (and each control's an
      # Android entry of the register names), run by the Android stage on
      # amd64 once the shards have observed the documents, or read from the
      # store when its outcome and judgments are keyed there
      # (proof.android.stage). Built here, with the main queue, from the same
      # corpus and stores.
      - name: Build the Android queue
        id: android
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 -m proof.store.queue android
          --corpus "$RUNNER_TEMP/corpus"
          --store "$RUNNER_TEMP/store/main" --store "$RUNNER_TEMP/store/scope"
          --timings proof/timings.json --arch arm64 --android-platform linux-amd64
          --out "$RUNNER_TEMP/lane/proof-android-queue-$GITHUB_RUN_ATTEMPT.json"
      - name: Upload the Android queue
        if: ${{ steps.android.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-android-queue-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Pack the proof corpus
        id: pack
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: >-
          tar -C "$RUNNER_TEMP/corpus" -cf - . |
          zstd -q -3 -T0 -o "$RUNNER_TEMP/lane/proof-corpus-$GITHUB_RUN_ATTEMPT.tar.zst"
      # The corpus before the queue: a shard that sees the queue fetches the
      # corpus with it (proof/ci/wait.mjs). Each is one file, uploaded as it
      # is (no zip), under its file's name.
      - name: Upload the proof corpus
        id: corpus
        if: ${{ steps.pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-corpus-${{ github.run_attempt }}.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 3
      - name: Upload the proof queue
        id: queue
        if: ${{ steps.corpus.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-queue-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      # A shard waiting for the queue stops at this marker (wait.mjs exits 3)
      # instead of waiting out its deadline; the failed step above says why.
      # It is written whenever the queue was not uploaded, including when a
      # step before the proof steps failed this job. Should the marker itself
      # not upload, the shards wait out their deadline instead, and "Proofs"
      # names the missing queue.
      - name: Mark the proof emission failed
        if: ${{ !cancelled() && steps.queue.outcome != 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/lane"
          echo '{"emission":"failed"}' > "$RUNNER_TEMP/lane/proof-emission-failed-$GITHUB_RUN_ATTEMPT"
      - name: Upload the proof emission's failure marker
        if: ${{ !cancelled() && steps.queue.outcome != 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-emission-failed-${{ github.run_attempt }}
          archive: false
          retention-days: 3
      - name: Lint (Biome)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      # The shards reach the artifact service through this generated bundle
      # (proof/ci/vendor/build.mjs), so it must be what its lock builds: a
      # lock bump without a rebuild, or a hand edit, fails here. It needs npm
      # and the registry only, and runs last, off the shards' path.
      - name: The vendored artifact client is what its lock builds
        run: node proof/ci/vendor/build.mjs --check

  test:
    # Every test runs once, in isolated workers. Shared database templates avoid
    # reinstalling extensions and replaying migrations for each behavior test.
    name: Test shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # Each shard boots its own Postgres testcontainer and applies the
      # case-store migrations in-process via Kysely's Migrator
      # (lib/case-store/sql/__tests__/applyMigrations.ts), so no migration CLI
      # is needed on PATH. ubuntu-latest already runs a Docker daemon for the
      # container itself.
      - uses: ./.github/actions/pull-test-image
      - name: Test suite
        run: npm test -- --shard=${{ matrix.shard }}/6
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-results/timings.json
          retention-days: 14

  tests-gate:
    # The branch ruleset requires a check literally named "Tests"; the shard
    # jobs above report per-shard names, so this fan-in is the required check.
    # `always()` keeps it from being skipped when a shard fails — GitHub
    # treats a skipped required check as passing.
    name: Tests
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Every test shard succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test shards finished with result '${{ needs.test.result }}'. Open the failing shard job for the vitest output."
            exit 1
          fi
          echo "All test shards passed."

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Generate the same image declarations Cloud Build renders. The UUID is
      # synthetic deployment identity, not a credential, and keeps the final
      # image contract valid without borrowing production state.
      - name: Render CI image configuration
        run: |
          ci_build_id="$(cat /proc/sys/kernel/random/uuid)"
          node scripts/rollout/render-build-config.mjs \
            --check \
            --build-id "$ci_build_id" \
            --output "$RUNNER_TEMP/rollout.env"
          echo "NOVA_CI_BUILD_ID=$ci_build_id" >> "$GITHUB_ENV"
      # This intentionally builds the final runner stage from the filtered
      # Docker context. Production-only values are replaced with synthetics;
      # no image is pushed and no source maps are uploaded.
      - name: Install reviewed Buildx
        run: bash scripts/rollout/install-buildx.sh
      - name: Build deployable image
        run: |
          source "$RUNNER_TEMP/rollout.env"
          export NOVA_IMAGE_TAG="commcare-nova:ci-$GITHUB_SHA"
          export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="ci-not-a-real-google-maps-key"
          export NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID="ac18fb2d87e44a1eb5a19883"
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          export NEXT_DEPLOYMENT_ID="$NOVA_CI_BUILD_ID"
          bash scripts/rollout/build-image.sh

  smoke-plan:
    name: Smoke execution plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          SMOKE_JOBS: ${{ inputs.smoke_jobs || 'default' }}
          SMOKE_WORKERS: ${{ inputs.smoke_workers || 'default' }}
        run: |
          matrix="$(node scripts/ci/smoke-matrix.mjs "$SMOKE_JOBS" "$SMOKE_WORKERS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.total }} (${{ matrix.workers }} workers)
    needs: smoke-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.smoke-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
        if: matrix.lane == 'app'
      # CI's public/authed projects use Chromium headless shell (no channel
      # override). Full Chrome is unused and cost 36s on the measured cold run.
      # Keep a separate cache so the old full-browser payload is not restored.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-shell-${{ runner.os }}-
      - name: Install Playwright (headless shell + OS deps)
        run: npx playwright install --with-deps --only-shell chromium
      # Hermetic: local Postgres + seeded session. No real GCP, no prod
      # credentials, no LLM spend. Runs the credential-free `public` checks and
      # the seeded-session `authed` checks. This catches UI / route / render /
      # session-contract breaks — but NOT the outbound dependency breaks (the
      # local stack networks nothing out); the `auth-healthz` job below is the
      # gate for those.
      - name: Smoke suite
        env:
          SMOKE_LANE: ${{ matrix.lane }}
          SMOKE_WORKERS: ${{ matrix.workers }}
          SMOKE_PARTITION: ${{ matrix.shard }}/${{ matrix.total }}
        run: |
          mkdir -p e2e/playwright-report
          if [ "$SMOKE_LANE" = browser ]; then
            /usr/bin/time -v -o "$RUNNER_TEMP/smoke-resources.txt" npm run test:smoke -- --project=browser --fail-on-flaky-tests
          else
            /usr/bin/time -v -o "$RUNNER_TEMP/smoke-resources.txt" npm run test:smoke -- --project=public --project=authed --fail-on-flaky-tests
          fi
      - name: Retain resource observations
        if: ${{ !cancelled() }}
        run: |
          mkdir -p e2e/playwright-report
          cp "$RUNNER_TEMP/smoke-resources.txt" e2e/playwright-report/resources.txt
          free -m > e2e/playwright-report/runner-memory.txt
          lscpu > e2e/playwright-report/runner-cpu.txt
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.lane }}-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7

  smoke-gate:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ always() }}
    steps:
      - name: Every smoke shard succeeded
        env:
          RESULT: ${{ needs.smoke.result }}
        run: test "$RESULT" = success

  auth-healthz:
    # The required-check NAME below ("Auth Firestore healthz") is PINNED by the
    # branch ruleset — keep it verbatim even though the job no longer probes
    # Firestore. It now runs ONE probe over the real outbound HTTP stack on the
    # prod-pinned Node (the local-Postgres smoke can't catch this class): the
    # auth credential path — login runs through the Cloud SQL connector, which
    # mints its cert + IAM token via google-auth-library → gaxios → node-fetch
    # (the #143/#145 outage class). scripts/ci/auth-healthz.ts exercises that
    # stack directly (a WIF token mint, no database). Its failure reds this
    # required gate.
    name: Auth Firestore healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WIF needs to mint an OIDC token; everything else stays read-only. Job-level
    # permissions REPLACE the workflow default, so `contents: read` is restated
    # for checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # Keyless auth to the isolated commcare-nova-ci project: GitHub's OIDC
      # token is exchanged via Workload Identity Federation for a CI service
      # account whose ONLY access is that dataless project. No long-lived keys
      # exist anywhere; the WIF provider is org-restricted and the SA is bound
      # only to this repo.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.CI_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      # Auth credential path: mint a token over the prod outbound stack. A
      # regression there (undici / gaxios / node-fetch keep-alive) throws or hangs
      # here and reds the PR.
      - name: Auth credential — token mint over the prod outbound stack
        run: npx tsx scripts/ci/auth-healthz.ts

  auth-contract:
    # Gates the session-cookie contract (a forged cookie ⇄ the real
    # better-auth / better-call session read path) on every PR. The test seeds +
    # asserts against Better Auth's Kysely/Postgres adapter on a per-test
    # testcontainer database (booted by the case-store vitest globalSetup) — no
    # emulator, no ADC. See lib/db/__tests__/sessionCookie.postgres.test.ts.
    name: Auth session-cookie contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          npm install --global "npm@$npm_version" --ignore-scripts
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
      - name: Session-cookie contract (Postgres testcontainer)
        run: node_modules/.bin/vitest run sessionCookie.postgres.test.ts

  proof-plan:
    # The proof lane's plan: the early queue (groups that need no corpus:
    # the harness's packages that do not read it, the surface, HQ's
    # self-checks; the lane's server refuses one holding a document's,
    # a control's or a package of proof.lane.blocks.CORPUS_PACKAGES), built
    # from the commit and the evidence store, and CI's proof matrix
    # (proof/run.mjs --matrix). It waits for smoke-plan so the shards it
    # creates queue behind every existing job.
    name: Proof execution plan
    needs: smoke-plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      android: ${{ steps.matrix.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            proof
            lib/commcare/surface
      - name: Name the proof lane's store snapshots
        id: store
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Restore main's evidence store
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        if: ${{ steps.store.outputs.scope != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      - name: Build the early queue
        run: |
          mkdir -p "$RUNNER_TEMP/lane"
          python3 -m proof.store.queue early \
            --store "$RUNNER_TEMP/store/main" --store "$RUNNER_TEMP/store/scope" \
            --timings proof/timings.json --arch arm64 \
            --out "$RUNNER_TEMP/lane/proof-early-queue-$GITHUB_RUN_ATTEMPT.json"
      - name: Upload the early queue
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/lane/proof-early-queue-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 14
      # The Android stage's shards (proof/README.md, "The Android stage"): each
      # runs one static bin of the Android queue's blocks.
      - id: matrix
        env:
          PROOF_SHARDS: ${{ inputs.proof_shards || 'default' }}
          ANDROID_SHARDS: ${{ inputs.android_shards || 'default' }}
        run: |
          matrix="$(node proof/run.mjs --matrix "$PROOF_SHARDS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$ANDROID_SHARDS" = default ]; then ANDROID_SHARDS="$(jq -r .shards proof/android/stage.json)"; fi
          android="$(jq -nc --argjson total "$ANDROID_SHARDS" '{include: [range(1; $total + 1) | {shard: ., total: $total}]}')"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  proof:
    # One shard of the native-proof lane (proof/README.md): HQ's real build,
    # Core's real runtime and HQ's real editors over Nova's exports, in the
    # pinned proof image beside a Postgres for HQ's state. A shard installs
    # nothing and emits nothing: it pulls the image and Postgres while it
    # fetches the queues and, once quality has emitted it, the corpus; then
    # one fork server (proof.lane.serve) boots HQ once, runs the early
    # queue's blocks and the main queue's as it claims them (proof/ci), and
    # its workers run each block's groups. A shard that starts after every
    # block is claimed ends before it restores, fetches or waits for
    # anything (the pulls it started are stopped with the job). Its job fails
    # only when the shard itself cannot run; whether the proofs hold is the
    # gate's.
    name: Proof ${{ matrix.shard }}/${{ matrix.total }}
    needs: proof-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.proof-plan.outputs.matrix) }}
    env:
      ATTEMPT: ${{ github.run_attempt }}
      SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            proof
            lib/commcare/surface
            .github/actions/proof-runtime
      # In the background, so they overlap every step up to the lane's start;
      # each writes its exit status when it ends, and holds none of the
      # step's output open, so the step ends at once.
      - name: Start pulling the proof image and Postgres
        run: |
          mkdir -p "$RUNNER_TEMP/pull"
          image="$(jq -r .image proof/image.lock)"
          (docker pull --quiet "$image" > "$RUNNER_TEMP/pull/image.log" 2>&1
           echo $? > "$RUNNER_TEMP/pull/image.code") > /dev/null 2>&1 &
          (PROOF_IMAGE="$image" docker compose -f proof/compose.yaml pull --quiet postgres \
             > "$RUNNER_TEMP/pull/postgres.log" 2>&1
           echo $? > "$RUNNER_TEMP/pull/postgres.code") > /dev/null 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: ./.github/actions/proof-runtime
      # Before anything else a shard would restore or fetch: a shard that
      # starts after every block is claimed ends here.
      - name: Download the early queue
        uses: actions/download-artifact@v8
        with:
          name: proof-early-queue-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/lane
      - name: Find whether any block is left
        id: left
        run: |
          # Static bins are this shard's alone, so they are always left to it.
          if [ "$PROOF_CLAIMS" = static ]; then
            echo "left=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode=create
          if [ "$PROOF_CLAIMS" = steal ]; then mode=steal; fi
          set +e
          node proof/ci/drained.mjs --queue "proof-queue-$ATTEMPT.json" \
            --failed "proof-emission-failed-$ATTEMPT" --prefix "proof-claim-$ATTEMPT-" --mode "$mode" \
            "$RUNNER_TEMP/lane/proof-early-queue-$ATTEMPT.json" > "$RUNNER_TEMP/lane/left.json"
          cat "$RUNNER_TEMP/lane/left.json"
          # Only a definite "nothing left" ends the shard early.
          left="$(jq -r .left "$RUNNER_TEMP/lane/left.json" 2>/dev/null)"
          if [ "$left" != false ]; then left=true; fi
          echo "left=$left" >> "$GITHUB_OUTPUT"
      - name: Name the proof lane's store snapshots
        id: store
        if: ${{ steps.left.outputs.left == 'true' }}
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Restore main's evidence store
        if: ${{ steps.left.outputs.left == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        if: ${{ steps.left.outputs.left == 'true' && steps.store.outputs.scope != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      # When quality has already uploaded them, the main queue and the corpus
      # are fetched here, while the pulls run; otherwise the lane's server
      # waits for them (--wait-for) while it runs the early queue.
      - name: Fetch the main queue and the corpus if they are ready
        if: ${{ steps.left.outputs.left == 'true' }}
        run: |
          set +e
          node proof/ci/wait.mjs --once --queue "proof-queue-$ATTEMPT.json" \
            --corpus "proof-corpus-$ATTEMPT.tar.zst" --failed "proof-emission-failed-$ATTEMPT" \
            --queue-to "$RUNNER_TEMP/lane/queue/queue.json" --corpus-to "$RUNNER_TEMP/corpus"
          code=$?
          case $code in 0|3|5) exit 0 ;; *) exit $code ;; esac
      # The lane reads one store: main's snapshot with this pull request's
      # newer records over it (proof/store), mounted read-only (PROOF_STORE).
      - name: Merge the restored stores
        if: ${{ steps.left.outputs.left == 'true' }}
        run: |
          python3 -m proof.store.pack merge --into "$RUNNER_TEMP/store/read" \
            "$RUNNER_TEMP/store/main" "$RUNNER_TEMP/store/scope"
      - name: Wait for the pulls
        if: ${{ steps.left.outputs.left == 'true' }}
        timeout-minutes: 5
        run: |
          for pull in image postgres; do
            while [ ! -s "$RUNNER_TEMP/pull/$pull.code" ]; do sleep 0.2; done
            if [ "$(cat "$RUNNER_TEMP/pull/$pull.code")" != 0 ]; then
              cat "$RUNNER_TEMP/pull/$pull.log"
              echo "::error::Pulling the proof lane's $pull failed; its output is above."
              exit 1
            fi
          done
      - name: Proof lane
        if: ${{ steps.left.outputs.left == 'true' }}
        env:
          PROOF_CORPUS: ${{ runner.temp }}/corpus
          PROOF_STORE: ${{ runner.temp }}/store/read
          PROOF_OUT_DIR: ${{ runner.temp }}/proof-out
          PROOF_EDITOR_AUDIT: '0.03'
          WORKERS: ${{ matrix.workers }}
        run: |
          set +e
          case "$PROOF_CLAIMS" in
            static) claim=(--claim static --bin "$SHARD") ;;
            steal) claim=(--claim "node proof/ci/claim.mjs --mode steal --shard $SHARD --by shard-$SHARD --listing-cache /tmp/proof-claims.json proof-claim-$ATTEMPT-{block}" --bin "$SHARD") ;;
            *) claim=(--claim "node proof/ci/claim.mjs --by shard-$SHARD --listing-cache /tmp/proof-claims.json proof-claim-$ATTEMPT-{block}" --bin "$SHARD") ;;
          esac
          node proof/run.mjs --lane --label "shard-${SHARD%/*}" --workers "$WORKERS" \
            --early-queue "$RUNNER_TEMP/lane/proof-early-queue-$ATTEMPT.json" \
            --queue "$RUNNER_TEMP/lane/queue/queue.json" \
            "${claim[@]}" \
            --wait-for "node proof/ci/wait.mjs --queue proof-queue-$ATTEMPT.json --corpus proof-corpus-$ATTEMPT.tar.zst --failed proof-emission-failed-$ATTEMPT" \
            --command-env ACTIONS_RUNTIME_TOKEN,ACTIONS_RESULTS_URL
          code=$?
          # 0: every item passed; 1: an item failed, which the gate reports
          # with every other shard's. Anything else is the shard's own failure.
          case $code in 0|1) exit 0 ;; *) exit $code ;; esac
      - name: Upload the shard's output
        if: ${{ !cancelled() && steps.left.outputs.left == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: proof-out-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/proof-out/
          retention-days: 14

  proof-android-runtime:
    # The Android reader's runtime (proof/android/README.md): commcare-android's
    # own unit-test build at the pins, kept in the Actions cache under the
    # digest of everything a build of it reads (proof/android/toolchain.py
    # key), so it is built once a pin. A run that finds it kept ends here in
    # seconds; one that does not builds it from the pins, with every download
    # named by commit, checksum or revision, holds the reader to its own
    # checks on it, and saves it for the stage's shards and every later run.
    name: Android reader runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            proof
            .github/actions/proof-android-runtime
      - uses: ./.github/actions/proof-android-runtime
        with:
          build: 'true'

  proof-android:
    # One shard of the lane's Android stage (proof/README.md, "The Android
    # stage"): commcare-android's own code, under Robolectric on amd64, reads
    # every archive a device installs of each document of its bin, from what
    # the proof shards observed (their outputs' records and blobs) and the
    # evidence store, and judges proofs 1, 3 and 4 over what it read
    # (python3 -m proof.android.stage). An answer the store holds under its
    # key (the archives, the restore, the options and the reader) is read and
    # not made again. Its job fails only when the shard itself cannot run;
    # whether Android's answers hold is the gate's, which reads this shard's
    # output with the proof shards'.
    name: Android ${{ matrix.shard }}/${{ matrix.total }}
    needs: [proof-plan, proof, proof-android-runtime]
    if: ${{ !cancelled() && needs.proof-plan.result == 'success' && needs.proof-android-runtime.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.proof-plan.outputs.android) }}
    env:
      ATTEMPT: ${{ github.run_attempt }}
      SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            proof
            lib/commcare/surface
            .github/actions/proof-android-runtime
      - id: runtime
        uses: ./.github/actions/proof-android-runtime
      - name: Download the Android queue
        uses: actions/download-artifact@v8
        with:
          name: proof-android-queue-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/lane
      - name: Download the corpus
        uses: actions/download-artifact@v8
        with:
          name: proof-corpus-${{ github.run_attempt }}.tar.zst
          path: ${{ runner.temp }}/lane
      - name: Download every proof shard's output
        uses: actions/download-artifact@v8
        with:
          pattern: proof-out-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      - name: Name the proof lane's store snapshots
        id: store
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Restore main's evidence store
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        if: ${{ steps.store.outputs.scope != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      - name: Android stage
        env:
          PROOF_ANDROID_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          TZ: UTC
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          zstd -q -d -c "$RUNNER_TEMP/lane/proof-corpus-$ATTEMPT.tar.zst" | tar -C "$RUNNER_TEMP/corpus" -xf -
          python3 -m proof.store.pack merge --into "$RUNNER_TEMP/store/read" \
            "$RUNNER_TEMP/store/main" "$RUNNER_TEMP/store/scope"
          shopt -s nullglob
          python3 -m proof.android.stage run \
            --queue "$RUNNER_TEMP/lane/proof-android-queue-$ATTEMPT.json" \
            --corpus "$RUNNER_TEMP/corpus" --store "$RUNNER_TEMP/store/read" \
            --bin "$SHARD" --jobs "$(nproc)" --out "$RUNNER_TEMP/android-out" \
            "$RUNNER_TEMP"/proof-shards/proof-out-*
      - name: Upload the shard's output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: proof-android-out-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/android-out/
          if-no-files-found: ignore
          retention-days: 14

  proof-android-again:
    # A dispatch that names an earlier CI run also runs the Android stage
    # again over what that run's proof shards observed, with this ref's
    # reader, judges and register (proof-android.yml): the way to hold a
    # change to any of those without waiting for the shards to observe
    # everything again. It is beside this run's own lane, which runs whole as
    # ever, and decides nothing of this run's verdict.
    name: Android stage over run ${{ inputs.android_from_run }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_from_run != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/proof-android.yml
    with:
      run: ${{ inputs.android_from_run }}
      shards: ${{ inputs.android_shards != 'default' && inputs.android_shards || '0' }}

  proofs-gate:
    # One check for the whole proof lane, whatever its shard count. It runs
    # on the runner's own Python with no image (proof.lane.gate): every block
    # of both queues ran exactly once, every item passed, every difference,
    # fresh or read from the store, falls in a class of the known-defect
    # register whose every entry some block saw, and the surface extracted at
    # the pins (the surface block's, or the store's for this image and
    # extractor) is the committed lib/commcare/surface/surface.json.
    # `always()` keeps it from being skipped when a shard fails.
    name: Proofs
    runs-on: ubuntu-latest
    needs: [proof-plan, proof, proof-android-runtime, proof-android]
    if: ${{ always() }}
    steps:
      - name: Every proof shard ran
        env:
          RESULT: ${{ needs.proof.result }}
          ANDROID: ${{ needs.proof-android.result }}
          RUNTIME: ${{ needs.proof-android-runtime.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Proof shards finished with result '$RESULT': a shard could not run its blocks. Open the failing shard job; the verdict below still lists every block that ran."
            exit 1
          fi
          if [ "$RUNTIME" != "success" ]; then
            echo "::error::The Android reader's runtime job finished with result '$RUNTIME', so the Android stage read nothing. Open \"Android reader runtime\": its build, or the reader's own checks on it, say why."
            exit 1
          fi
          if [ "$ANDROID" != "success" ]; then
            echo "::error::The Android stage's shards finished with result '$ANDROID': a shard could not run its blocks. Open the failing Android job; the verdict below still lists every block that ran."
            exit 1
          fi
          echo "Every proof shard and every Android shard ran."
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        with:
          sparse-checkout: |
            proof
            lib/commcare/surface
      - name: Download every shard's output
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: proof-out-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      - name: Download every Android shard's output
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: proof-android-out-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      # The early, main and Android queues (proof-early-queue, proof-queue,
      # proof-android-queue).
      - name: Download the queues
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: proof-*queue-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/queues
          merge-multiple: true
      - name: Name the proof lane's store snapshots
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        id: store
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Restore main's evidence store
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' && steps.store.outputs.scope != '' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      - name: The shards ran every block once and held every difference to the register
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        run: |
          if [ ! -f "$RUNNER_TEMP/queues/proof-queue-$GITHUB_RUN_ATTEMPT.json" ]; then
            echo "::error::The run holds no main queue: \"Lint & type-check\" did not emit the proof corpus or build the queue, so no corpus document ran. Its proof steps (from \"Emit the proof corpus\" on) say which one failed and why."
            exit 1
          fi
          python3 -m proof.store.pack merge --into "$RUNNER_TEMP/store/read" \
            "$RUNNER_TEMP/store/main" "$RUNNER_TEMP/store/scope"
          if [ ! -f "$RUNNER_TEMP/queues/proof-android-queue-$GITHUB_RUN_ATTEMPT.json" ]; then
            echo "::error::The run holds no Android queue: \"Lint & type-check\" built the main queue and not the Android one, so no document's archives were read by CommCare Android. Its \"Build the Android queue\" step says why."
            exit 1
          fi
          shopt -s nullglob
          outputs=("$RUNNER_TEMP"/proof-shards/proof-out-* "$RUNNER_TEMP"/proof-shards/proof-android-out-*)
          if [ ${#outputs[@]} -eq 0 ]; then
            echo "::error::No proof shard uploaded an output, so no block ran."
            exit 1
          fi
          python3 -m proof.lane.gate "${outputs[@]}" \
            --early-queue "$RUNNER_TEMP/queues/proof-early-queue-$GITHUB_RUN_ATTEMPT.json" \
            --queue "$RUNNER_TEMP/queues/proof-queue-$GITHUB_RUN_ATTEMPT.json" \
            --android-queue "$RUNNER_TEMP/queues/proof-android-queue-$GITHUB_RUN_ATTEMPT.json" \
            --store "$RUNNER_TEMP/store/read" --summary "$RUNNER_TEMP/verdict/verdict.json"
      - name: Upload the verdict
        if: ${{ !cancelled() && needs.proof-plan.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: proof-verdict-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict/
          if-no-files-found: ignore
          retention-days: 14

  proof-store:
    # Beside the gate, so the save is not on the lane's critical path: this
    # pull request's evidence store becomes what it held and what this run
    # observed that main's does not hold, saved whatever the verdict, so a fix
    # pushed next reruns only what it changes.
    name: Proof store
    runs-on: ubuntu-latest
    needs: [proof-plan, proof, proof-android]
    # Not in a cancelled run: a newer push cancels this one (concurrency),
    # and a partial store saved then would only take a runner from the run
    # that replaced it.
    if: ${{ !cancelled() && needs.proof-plan.result == 'success' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: proof
      - name: Name the proof lane's store snapshots
        id: store
        env:
          PROOF_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node proof/ci/store-keys.mjs --arch arm64
      - name: Download every shard's output
        uses: actions/download-artifact@v8
        with:
          pattern: proof-out-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      # The Android stage's outputs are outputs like a shard's: their deltas
      # hold each answer the reader made, and their blocks each document's
      # Android group.
      - name: Download every Android shard's output
        uses: actions/download-artifact@v8
        with:
          pattern: proof-android-out-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/proof-shards
      # The queues name the key each package group's, each Android group's and
      # the surface block's outcome is kept under (proof/store/pack.py).
      - name: Download the queues
        uses: actions/download-artifact@v8
        with:
          pattern: proof-*queue-${{ github.run_attempt }}.json
          path: ${{ runner.temp }}/queues
          merge-multiple: true
      - name: Restore main's evidence store
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/main
          key: ${{ steps.store.outputs.main }}none
          restore-keys: ${{ steps.store.outputs.main }}
      - name: Restore this pull request's evidence store
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/store/scope
          key: ${{ steps.store.outputs.scope }}none
          restore-keys: ${{ steps.store.outputs.scope }}
      - name: Gather this pull request's evidence store
        run: |
          shopt -s nullglob
          queues=()
          for queue in proof-early-queue proof-queue proof-android-queue; do
            if [ -f "$RUNNER_TEMP/queues/$queue-$GITHUB_RUN_ATTEMPT.json" ]; then
              queues+=(--queue "$RUNNER_TEMP/queues/$queue-$GITHUB_RUN_ATTEMPT.json")
            fi
          done
          python3 -m proof.store.pack delta --base "$RUNNER_TEMP/store/main" \
            --scope "$RUNNER_TEMP/store/scope" --out "$RUNNER_TEMP/store/next" \
            "${queues[@]}" \
            "$RUNNER_TEMP"/proof-shards/proof-out-* "$RUNNER_TEMP"/proof-shards/proof-android-out-*
      - name: Save this pull request's evidence store
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/store/next
          key: ${{ steps.store.outputs.key }}
