name: S7 slice
# Throwaway diagnostic workflow. It exists only on s7/ci/* branches and never ships.
on:
  push:
    branches: ['s7/ci/**']
permissions:
  contents: read
jobs:
  slice:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: [{"name": "types", "cmd": "npm run typecheck", "playwright": false}, {"name": "installation-unit", "cmd": "npm test -- --project unit --maxWorkers=2 lib/commcare/__tests__/installationProfiles.test.ts lib/commcare/__tests__/installationReleaseFiles.test.ts lib/commcare/__tests__/probeBuildProfile.test.ts lib/deployment/__tests__/installationProfileReview.test.ts lib/deployment/__tests__/installationPractice.test.ts lib/mcp/__tests__/readingProjection.test.ts lib/mcp/__tests__/hqChangesProjection.test.ts", "playwright": false}, {"name": "installation-postgres", "cmd": "npm test -- --project postgres --maxWorkers=2 lib/deployment/__tests__/endDeployment.postgres.test.ts lib/deployment/__tests__/adoptedLedger.postgres.test.ts lib/deployment/__tests__/store.postgres.test.ts lib/mcp/__tests__/uploadAppToHq.postgres.test.ts -t 'installation|workbook atomically|browser session|superseded completion'", "playwright": false}, {"name": "installation-lifecycle", "cmd": "npm test -- --project postgres --maxWorkers=2 lib/deployment/__tests__/publishSequence.postgres.test.ts lib/deployment/__tests__/hqChanges.postgres.test.ts lib/deployment/__tests__/managedPlaces.postgres.test.ts lib/deployment/__tests__/managedReRead.postgres.test.ts -t 'installation|practice|named profile'", "playwright": false}]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP"
          for attempt in 1 2 3; do
            if npm install --global "npm@$npm_version" --ignore-scripts; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - uses: ./.github/actions/pull-test-image
      - name: Cache Playwright browsers
        if: matrix.playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-shell-webkit-${{ runner.os }}-
      - name: Install Playwright
        if: matrix.playwright
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps --only-shell chromium webkit
      - name: Run
        env:
          SLICE_CMD: ${{ matrix.cmd }}
        run: bash -eo pipefail -c "$SLICE_CMD"
