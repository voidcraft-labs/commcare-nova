name: Download proof artifacts
description: Downloads exact proof artifacts into directories named for each artifact.
inputs:
  prefix:
    description: Exact artifact name prefix
    default: ""
  suffix:
    description: Exact artifact name suffix
    default: ""
  labels:
    description: Whitespace-separated names between the prefix and suffix
    default: ""
  shard-counts:
    description: Whitespace-separated label=count pairs for shard outputs from this attempt
    default: ""
  allow-missing:
    description: Preserve available evidence when a failed lane never uploaded an artifact
    default: "false"
  path:
    description: Parent directory for the named artifact directories
    required: true
runs:
  using: node24
  main: index.mjs
