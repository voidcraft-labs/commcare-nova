// Builds what the Android reader runs on (proof/android/README.md) in commcare-android's own unit-test build, at
// the pinned checkout, without changing a file of it (proof/android/build-runtime.sh runs it):
//
//   ./gradlew --no-daemon -I <this file> -PnovaAndroidClasspathFile=<path> :app:writeNovaAndroidClasspath
//
// `writeNovaAndroidClasspath` compiles the project's unit tests and records the classpath the reader runs on:
// each jar of the app's own runtime classpath (the libraries the app ships), then what Gradle gives its
// unit-test task: the compiled app and its R class, the project's own test classes (its test application, its
// SQLCipher and encryption shadows, its HTTP and sync mocks), every dependency, and the directory holding
// `com/android/tools/test_config.properties`, through which Robolectric finds the merged manifest, resources and
// assets. The reader's own classes are not built here: the reader compiles them against this classpath when it
// starts (proof/android/client.py), so a runtime is a function of the pins and this file alone.
//
// The compile SDK: the app asks for `compileSdk 37`, which the Android Gradle plugin at this pin (8.13.2) looks
// up as the platform `android-37`. The SDK repository publishes API 37 as `platforms;android-37.0`, which the
// plugin installs into `platforms/android-37.0` and then cannot find under the hash it asked for. The same
// platform is named here by the hash the plugin gives it. It is what the app's code compiles against and
// nothing the reader runs: Robolectric runs the project's tests on its own Android runtime
// (unit-tests/resources/robolectric.properties, `sdk=23`).
allprojects { project ->
    project.plugins.withId('com.android.application') {
        def properties = gradle.startParameter.projectProperties
        project.extensions.getByName('androidComponents').finalizeDsl { extension ->
            extension.compileSdkVersion('android-37.0')
        }
        project.afterEvaluate {
            def classpathFile = properties.get('novaAndroidClasspathFile')
            def test = project.tasks.named('testCommcareDebugUnitTest', Test)
            project.tasks.register('writeNovaAndroidClasspath') {
                // Everything the unit-test task itself waits for: the compiled sources, the merged resources,
                // assets and manifest its configuration names.
                dependsOn { test.get().taskDependencies.getDependencies(test.get()) }
                doLast {
                    if (!classpathFile) {
                        throw new GradleException(
                            'Pass -PnovaAndroidClasspathFile=<path> to record the unit-test classpath.')
                    }
                    def entries = test.get().classpath.files.collect { it.absolutePath }
                    // The libraries the app itself ships, ahead of the unit tests' own: Gradle resolves the
                    // unit-test classpath with the tests' dependencies, which move some of the app's libraries
                    // to other versions than the app's runtime classpath holds (Guava among them: the app ships
                    // the JRE flavour Core is compiled against, the tests resolve the Android flavour, which
                    // lacks methods Core calls). A device runs the app's, so each jar of the app's own runtime
                    // classpath comes first.
                    def shipped = project.configurations.getByName('commcareDebugRuntimeClasspath').incoming
                        .artifactView { view ->
                            view.attributes { it.attribute(
                                org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar') }
                            view.lenient(true)
                        }.files.files.findAll { it.name.endsWith('.jar') }.collect { it.absolutePath }
                    def ordered = (shipped + entries).unique()
                    new File(classpathFile).text = ordered.join('\n') + '\n'
                }
            }
        }
    }
}
