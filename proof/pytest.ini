# The proof harness's pytest configuration (proof/README.md). The harness runs
# inside the proof image with plugin autoloading disabled
# (PYTEST_DISABLE_PLUGIN_AUTOLOAD=1), so none of the plugins HQ's virtualenv
# carries (pytest-django, ddtrace, flaky, unmagic and the rest) changes how a
# check is collected or run: the harness boots HQ itself.
[pytest]
minversion = 9.0
addopts = -p no:cacheprovider --strict-markers --strict-config -ra
python_files = test_*.py
xfail_strict = true
empty_parameter_set_mark = fail_at_collect
markers =
    under_determinism: holds only under HQ's determinism and a seeded emission, so it is skipped where PROOF_HQ_DETERMINISM=0 or the corpus was emitted with PROOF_ENTROPY=real (the weekly unseeded run leaves both real)
    reader: starts a served reader (Formplayer, the Web Apps client's browser, a device, Connect), so a run without the readers (PROOF_READERS=0) deselects it and leaves it to the nightly (proof/lane/readers.py); a test whose fixtures start one is marked by proof/conftest.py, one that starts one itself is marked by hand
